# Keine Werte, nur Namen. Diese Datei darf im Repo stehen.
REPO_PULSE=neoalphavault-png/kaspa-pulse
REPO_STUDIO=neoalphavault-png/pulse-studio
TAKT_REF=main
# Scharf seit 13.10.2026 (Ben). Der zweite Schalter ist die
# Repository-Variable REELS_LIVE in pulse-studio; ohne beide
# veroeffentlicht kein Lauf. Zurueck auf false, und jeder Reel-Lauf ist
# wieder trocken, ohne eine Variable auf GitHub anzufassen.
REEL_LIVE=true
# Weekly Numbers: dry_run=true rechnet nur. Auf false setzen, wenn der
# Montagspost wirklich vom Server kommen soll.
WN_DRY_RUN=false
# Tagesgrafik auf Instagram, scharf seit 14.10.2026 (Ben). Der zweite
# Schalter ist die Repository-Variable IG_MODUS in kaspa-pulse. Zurueck auf
# trocken, und der 09:30-Takt laeuft wieder als Handstart, ohne zu posten.
IG_LIVE=scharf
# Reichweiten-Uhrwerk (Ben, 15.10.2026). trocken schreibt die
# Schnappschuesse und schickt die Meldung nach #ops-log, sonst
# nichts. Nach zwei stillen Tagen auf scharf - dann kommt auch der
# Ausreisser-Alarm. Ohne den Timer takt-uhrwerk.timer laeuft nichts davon.
UHRWERK_LIVE=trocken
THREADS_LIVE=scharf
