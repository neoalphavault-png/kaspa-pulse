# BCHN geprunt auf c2 (Ben, 09.11.2026). Voll validierend: jeder Block wird
# geladen und geprueft, danach loescht der Knoten alte Blockdateien. Der
# Index aller Koepfe bleibt, getblockhash geht fuer jede Hoehe.
# Keine Werte in dieser Datei. RPC nur ueber das Cookie im Datenordner.
server=1
# nur ausgehende Verbindungen, kein Port nach aussen
listen=0
discover=0
maxconnections=12
# geprunt, Blockdateien hoechstens etwa 4 GB
prune=4000
# kleiner Datenbank-Cache wegen 3,7 GB RAM auf c2
dbcache=300
maxmempool=50
blocksonly=1
disablewallet=1
# RPC nur lokal
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
# keine Peer-Adressen im Log (Standard, hier ausdruecklich)
logips=0
shrinkdebugfile=1
