  lesen:
    needs: [plan, w12]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.w12.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sdk, version und pruefsumme fest
        run: "pip install --only-binary=:all: --require-hashes -r scripts/maschinenzahlungen-requirements.txt"
      - name: zwei knoten, je minute zur sekunde 0
        env:
          VON: ${{ needs.plan.outputs.t0 }}
          BIS: ${{ needs.plan.outputs.ende }}
          LOS: ${{ needs.plan.outputs.los }}
        run: |
          rest=$(( LOS - $(date +%s) ))
          if [ "$rest" -gt 0 ]; then echo "warte $rest s"; sleep "$rest"; fi
          mkdir -p out/gebuehren
          P="$RUNNER_TEMP/tn10-gebuehren-partner.json"
          python3 scripts/tn10_gebuehren.py --lesen --von "$VON" --bis "$BIS" --rolle k1 --partner "$P" --out out/gebuehren > out/k1.log 2>&1 &
          P1=$!
          python3 scripts/tn10_gebuehren.py --lesen --von "$VON" --bis "$BIS" --rolle k2 --partner "$P" --out out/gebuehren > out/k2.log 2>&1 &
          P2=$!
          S=0
          wait $P1 || S=1
          wait $P2 || S=1
          tail -n 3 out/k1.log out/k2.log
          python3 scripts/tn10_gebuehren.py --nebeneinander out/gebuehren --von "$VON" --bis "$BIS"
          echo "=== gebuehren nebeneinander, csv"
          cat out/gebuehren/gebuehren-nebeneinander.csv
          echo "=== meldungen, fehlertexte ohne adressen"
          python3 -c "import json,sys; [print(r, m) for r in ('k1','k2') for m in json.load(open('out/gebuehren/gebuehren-%s.json' % r)).get('meldungen', [])]" || true
          rm -f out/*.log
          exit $S
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tn10-gebuehren
          path: out/gebuehren/
          if-no-files-found: ignore
          retention-days: 30
