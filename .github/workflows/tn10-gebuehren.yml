# Kaspa Pulse - Gebuehrenleser TN10 (Ben, 13.10.2026)
#
# Liegt bewusst NUR auf dem Branch messung/tn10-zaehler. Nicht gemergt.
# Je Minute zur Sekunde 0 GetFeeEstimate an zwei unabhaengigen TN10-Knoten
# (je ein Prozess, k2 meidet den Knoten von k1). Startzeit und Dauer aus
# messung/tn10/gebuehren/, bis dahin schlafen Wartejobs ohne Abfrage.
# Nur lesend. Keine IP, kein Hostname, keine Wallet, keine Secrets.

name: tn10 gebuehren

on:
  push:
    branches:
      - messung/tn10-zaehler
    paths:
      - messung/tn10/gebuehren/start.txt
      - messung/tn10/gebuehren/dauer.txt

permissions:
  contents: read

# pipefail, damit ein fehlgeschlagener selbsttest vor "| tail" den lauf stoppt (Ben, 15.10.2026)
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

concurrency:
  group: tn10-gebuehren
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      t0: ${{ steps.p.outputs.t0 }}
      ende: ${{ steps.p.outputs.ende }}
      los: ${{ steps.p.outputs.los }}
      wn: ${{ steps.p.outputs.wn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: selbsttest
        run: python3 scripts/tn10_gebuehren.py --selbsttest | tail -n 1
      - name: fenster
        id: p
        run: python3 scripts/tn10_gebuehren.py --plan --start messung/tn10/gebuehren/start.txt --dauer "$(grep -v '^#' messung/tn10/gebuehren/dauer.txt | head -n 1 | tr -d '[:space:]')" | tee -a "$GITHUB_OUTPUT"

  w1:
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.wn) >= 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: warten ohne abfragen
        env:
          LOS: ${{ needs.plan.outputs.los }}
        run: |
          rest=$(( LOS - $(date +%s) ))
          if [ "$rest" -gt 20400 ]; then rest=20400; fi
          if [ "$rest" -gt 0 ]; then echo "warte $rest s"; sleep "$rest"; else echo "nichts zu warten"; fi
  w2:
    needs: [plan, w1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.w1.result == 'success' && fromJSON(needs.plan.outputs.wn) >= 2 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
