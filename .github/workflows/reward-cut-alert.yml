name: reward-cut-alert

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reward-cut-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: run reward cut check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 scripts/reward_cut_alert.py

      - name: persist state if changed
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add scripts/reward_cut_state.json
          if git diff --staged --quiet; then
            echo "state unveraendert, kein commit"
          else
            git commit -m "reward cut state update [bot]"
            git pull --rebase origin main
            git push
          fi
