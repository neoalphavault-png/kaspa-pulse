name: reward cut alert

on:
  schedule:
    # alle 10 Minuten. Der Job beendet sich in Sekunden, wenn nichts ansteht.
    # Nur kurz vor einem Cut wartet er auf die Punktlandung.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reward-cut-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Selbsttest zuerst. Prueft die Rundungsregel fuer Differenzen und
      # dass in veroeffentlichten Texten keine Uhrzeit steht, gegen die
      # Zahlen des Cuts vom 05.10.2026. Faellt er, wird nichts gepostet.
      - name: selbsttest
        run: python3 scripts/reward_cut_alert.py --selbsttest

      - name: watch the emission schedule
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 scripts/reward_cut_alert.py

      - name: persist state if changed
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add scripts/reward_cut_state.json
          if git diff --staged --quiet; then
            echo "state unveraendert, kein commit"
          else
            git commit -m "reward cut state update [bot]"
            git pull --rebase origin main
            git push
          fi
