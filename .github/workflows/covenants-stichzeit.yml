# Kaspa Pulse - eigene Zaehlung Covenant- und Script-Hash-UTXOs zu einer Stichzeit (Ben, 21.10.2026)
#
# Liegt bewusst NUR auf dem Branch messung/covenants-stichzeit. Nicht gemergt.
# Eigener Mainnet-Knoten im Runner (rusty-kaspa v2.1.0), synchronisiert neu,
# wird gestoppt, dann liest kp-stichzeit den UTXO-Bestand aus der Datenbank und
# rechnet ihn auf die Stichzeit zurueck (Zweitpruefung vorwaerts vom
# Pruning-Punkt). Knoten-Logs gehen in eine Datei, die nie ausgegeben und nie
# hochgeladen wird: dort stehen Peer-Adressen. Keine Wallet, keine Schluessel,
# keine Secrets. Ergebnis nur als Artefakt, nichts ins Repo. Die Bestandsdatei
# mit Adressen bleibt im Runner (seit 22.10.2026), hochgeladen werden nur Summen.

name: covenants stichzeit

on:
  push:
    branches:
      - messung/covenants-stichzeit
    paths:
      - messung/covenants-stichzeit/start.txt

permissions:
  contents: read

concurrency:
  group: covenants-stichzeit
  cancel-in-progress: false

jobs:
  zaehlen:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      KASPA_TAG: v2.1.0
      APP: /mnt/kp/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sdk, version und pruefsumme fest
        run: "pip install --only-binary=:all: --require-hashes -r scripts/maschinenzahlungen-requirements.txt"

      - name: selbsttests
        run: |
          python3 scripts/kp_stichzeit_warten.py --selbsttest | tail -n 1
          python3 scripts/kp_stichzeit_auswertung.py --selbsttest | tail -n 1
          python3 scripts/kp_stichzeit_skripte.py --selbsttest | tail -n 1

      - name: platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo mkdir -p /mnt/kp && sudo chown "$USER" /mnt/kp
          df -h / /mnt | tail -n 2

      - name: kaspad holen (fertiges release)
        id: bin
        run: |
          set -euo pipefail
          mkdir -p /mnt/kp/bin && cd /mnt/kp/bin
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/kaspanet/rusty-kaspa/releases/tags/${KASPA_TAG}" > rel.json
          url=$(python3 -c "
          import json
          a=[x for x in json.load(open('rel.json'))['assets'] if 'linux' in x['name'] and ('amd64' in x['name'] or 'x86_64' in x['name']) and x['name'].endswith('.zip')]
          print(a[0]['browser_download_url'] if a else '')")
          if [ -z "$url" ]; then echo "kein fertiges linux-release gefunden"; echo "ok=nein" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "release-datei: $(basename "$url")"
          curl -fsSL "$url" -o k.zip && unzip -q k.zip
          k=$(find . -type f -name kaspad | head -n 1)
          chmod +x "$k" && cp "$k" /mnt/kp/kaspad
          sha256sum /mnt/kp/kaspad | cut -c1-64
          /mnt/kp/kaspad --version > /mnt/kp/version.txt 2>&1 || true; head -n 1 /mnt/kp/version.txt
          echo "ok=ja" >> "$GITHUB_OUTPUT"

      - name: knoten starten, ausgabe nur in datei
        if: steps.bin.outputs.ok == 'ja'
        run: |
          mkdir -p "$APP"
          nohup /mnt/kp/kaspad --yes --appdir="$APP" --nologfiles --disable-upnp \
            --rpclisten-borsh > /mnt/kp/kaspad.log 2>&1 &
          echo $! > /mnt/kp/kaspad.pid
          sleep 20
          kill -0 "$(cat /mnt/kp/kaspad.pid)" && echo "knoten laeuft"

      - name: rusty-kaspa quelle und werkzeug bauen
        run: |
          set -euo pipefail
          sudo apt-get install -y -q protobuf-compiler clang > /dev/null
          git clone -q --depth 1 --branch "$KASPA_TAG" https://github.com/kaspanet/rusty-kaspa /mnt/kp/rk
          cp -r messung/covenants-stichzeit/werkzeug /mnt/kp/rk/kp-stichzeit
          cd /mnt/kp/rk
          sed -i '0,/^members = \[/s//members = [\n    "kp-stichzeit",/' Cargo.toml
          export CARGO_TARGET_DIR=/mnt/kp/target
          if [ "${{ steps.bin.outputs.ok }}" = "ja" ]; then
            nice cargo build -q --release -p kp-stichzeit
          else
            cargo build -q --release -p kp-stichzeit -p kaspad
            cp /mnt/kp/target/release/kaspad /mnt/kp/kaspad
            mkdir -p "$APP"
            nohup /mnt/kp/kaspad --yes --appdir="$APP" --nologfiles --disable-upnp \
              --rpclisten-borsh > /mnt/kp/kaspad.log 2>&1 &
            echo $! > /mnt/kp/kaspad.pid
          fi
          ls -la /mnt/kp/target/release/kp-stichzeit | awk '{print $5, $9}'

      - name: warten bis synchron
        run: |
          python3 scripts/kp_stichzeit_warten.py --stichzeit-ms "$(sed -n 's/^spaeteste_ms=//p' messung/covenants-stichzeit/start.txt)" --max-min 290 --vorlauf-min 15
          df -h /mnt | tail -n 1
          du -sh "$APP" | cut -f1

      - name: knoten stoppen
        if: always()
        run: |
          p=$(cat /mnt/kp/kaspad.pid 2>/dev/null || true)
          [ -n "$p" ] && kill -INT "$p" 2>/dev/null || true
          for i in $(seq 1 120); do kill -0 "$p" 2>/dev/null || break; sleep 5; done
          kill -0 "$p" 2>/dev/null && echo "knoten noch nicht beendet" || echo "knoten beendet"

      - name: bestand zur stichzeit
        run: |
          set -uo pipefail
          zeiten=$(sed -n 's/^stichzeiten_ms=//p' messung/covenants-stichzeit/start.txt)
          mkdir -p /mnt/kp/aus
          versuch() {
            for d in $(ls -d "$APP"/kaspa-mainnet/datadir/consensus/consensus-* | sort -r); do
              echo "versuche $(basename "$d")"
              if /mnt/kp/target/release/kp-stichzeit "$d" /mnt/kp/aus $zeiten > /mnt/kp/aus/stdout.json 2> /mnt/kp/aus/stderr.txt; then
                grep -v -E '([0-9]{1,3}\.){3}[0-9]{1,3}' /mnt/kp/aus/stderr.txt | tail -n 5
                return 0
              fi
              grep -v -E '([0-9]{1,3}\.){3}[0-9]{1,3}' /mnt/kp/aus/stderr.txt | tail -n 5
            done
            return 1
          }
          # Reparaturschleife: scheitert das werkzeug, bleibt die gestoppte
          # datenbank liegen. Ein neuer stand von werkzeug/ oder der auswertung
          # auf diesem branch wird geholt, neu gebaut und noch einmal versucht.
          stand=$(git rev-parse HEAD:messung/covenants-stichzeit/werkzeug)
          bis=$(( $(date +%s) + 150 * 60 ))
          until versuch; do
            [ "$(date +%s)" -lt "$bis" ] || { echo "werkzeug gescheitert, keine reparatur bis zum ende"; exit 1; }
            echo "warte auf reparatur am werkzeug"
            while [ "$(date +%s)" -lt "$bis" ]; do
              sleep 60
              git fetch -q origin messung/covenants-stichzeit || continue
              neu=$(git rev-parse FETCH_HEAD:messung/covenants-stichzeit/werkzeug)
              if [ "$neu" != "$stand" ]; then
                git checkout -q FETCH_HEAD -- messung/covenants-stichzeit/werkzeug scripts/kp_stichzeit_auswertung.py
                rm -rf /mnt/kp/rk/kp-stichzeit && cp -r messung/covenants-stichzeit/werkzeug /mnt/kp/rk/kp-stichzeit
                ( cd /mnt/kp/rk && CARGO_TARGET_DIR=/mnt/kp/target cargo build -q --release -p kp-stichzeit ) && stand=$neu && echo "neu gebaut" && break
              fi
            done
          done
          # Auswertung, mit eigener Reparaturschleife: die Bestandsdatei mit
          # Adressen bleibt im Runner und wird nie hochgeladen (Ben, 22.10.2026).
          tony=$(sed -n 's/^tony=//p' messung/covenants-stichzeit/start.txt)
          auswerten() {
            python3 scripts/kp_stichzeit_auswertung.py /mnt/kp/aus/bestand.csv /mnt/kp/aus/stand.json /mnt/kp/aus/auswertung.json || return 1
            if [ -n "$tony" ]; then
              python3 scripts/kp_stichzeit_skripte.py /mnt/kp/aus/bestand.csv "$tony" /mnt/kp/aus || return 1
            fi
          }
          sstand=$(git rev-parse HEAD:scripts)
          bis=$(( $(date +%s) + 90 * 60 ))
          until auswerten; do
            [ "$(date +%s)" -lt "$bis" ] || { echo "auswertung gescheitert, keine reparatur bis zum ende"; exit 1; }
            echo "warte auf reparatur an der auswertung"
            while [ "$(date +%s)" -lt "$bis" ]; do
              sleep 60
              git fetch -q origin messung/covenants-stichzeit || continue
              neu=$(git rev-parse FETCH_HEAD:scripts)
              if [ "$neu" != "$sstand" ]; then
                git checkout -q FETCH_HEAD -- scripts messung/covenants-stichzeit/tony && sstand=$neu && echo "auswertung neu geholt" && break
              fi
            done
          done
          python3 -c "import json; d=json.load(open('/mnt/kp/aus/stand.json')); print(json.dumps({k: d[k] for k in ('hauptstichzeit','hauptstichblock','pruning_punkt_zeit','kettenspitze_zeit','zweitpruefung')}, indent=2))"
          wc -l /mnt/kp/aus/bestand.csv
          sha256sum /mnt/kp/aus/bestand.csv /mnt/kp/aus/stand.json /mnt/kp/aus/auswertung.json /mnt/kp/aus/skripte-abgleich.* 2>/dev/null || true

      - name: ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: covenants-stichzeit
          path: |
            /mnt/kp/aus/stand.json
            /mnt/kp/aus/auswertung.json
            /mnt/kp/aus/skripte-abgleich.csv
            /mnt/kp/aus/skripte-abgleich.json
          if-no-files-found: ignore
          retention-days: 30
