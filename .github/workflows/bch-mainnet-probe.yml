# bch-mainnet-probe.yml - Testlauf: BCH-Mainnet-Koepfe ueber P2P und gezaehlte
# Wartezeit fuer 1, 3 und 6 Bestaetigungen (Ben, 22.11.2026: KW48, hoechstens ein Tag).
#
# Laeuft nur auf dem Branch messung/bch-mainnet-probe, ohne Secret, kein Commit
# nach main. Header-Client und Werkzeuge kommen aus pulsehawk/methods, Branch
# headers/bch-mainnet (Profil bch-mainnet). Seeds und Checkpoints liest der Lauf
# aus BCHN src/chainparams.cpp (CMainParams); keine Adresse und kein Hostname
# steht im Repo oder im Log, nur die Software der Peers.
name: bch mainnet probe

on:
  push:
    branches: ["messung/bch-mainnet-probe"]
    paths:
      - "data/bch-mainnet/anstoss.txt"
      - ".github/workflows/bch-mainnet-probe.yml"

permissions:
  contents: write

concurrency:
  group: bch-mainnet-probe
  cancel-in-progress: false

jobs:
  zaehlen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: messung/bch-mainnet-probe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: methoden holen
        run: git clone -q --depth 1 -b headers/bch-mainnet https://github.com/pulsehawk/methods "$RUNNER_TEMP/methods"

      - name: koepfe holen
        run: |
          set -eu
          M="$RUNNER_TEMP/methods"
          curl -sSf -m 60 -o "$RUNNER_TEMP/chainparams.cpp" \
            https://gitlab.com/bitcoin-cash-node/bitcoin-cash-node/-/raw/master/src/chainparams.cpp
          python3 -I "$M/tools/bchn_chainparams.py" "$RUNNER_TEMP/chainparams.cpp" --class CMainParams \
            --checkpoints "$RUNNER_TEMP/checkpoints.txt"
          args=()
          while read -r s; do args+=(--seed "$s"); done < <(python3 -I "$M/tools/bchn_chainparams.py" "$RUNNER_TEMP/chainparams.cpp" --class CMainParams --seeds)
          echo "${#args[@]} seed-argumente"
          python3 "$M/headers/ph_headers.py" --network bch-mainnet "${args[@]}" \
            --checkpoints "$RUNNER_TEMP/checkpoints.txt" --from 951145 \
            --out data/bch-mainnet/koepfe.csv.gz --meta data/bch-mainnet/koepfe-meta.json

      - name: wartezeit zaehlen
        run: |
          set -eu
          python3 "$RUNNER_TEMP/methods/tools/conf_wait.py" --heads data/bch-mainnet/koepfe.csv.gz \
            --target 600 --k 1 3 6 12 --json data/bch-mainnet/wartezeit.json
          { echo '## BCH mainnet, Wartezeit'; echo '```'; cat data/bch-mainnet/wartezeit.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: secret-scan
        run: python3 scripts/secret_scan.py --baum

      - name: committen
        run: |
          set -eu
          git config user.name "bch mainnet bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bch-mainnet
          if git diff --cached --quiet; then echo "nichts neu"; exit 0; fi
          git commit -m "bch mainnet: koepfe und wartezeit [bot]"
          for v in 1 2 3; do git pull -q --rebase -X theirs origin messung/bch-mainnet-probe && git push -q origin HEAD:messung/bch-mainnet-probe && exit 0; sleep 10; done
          exit 1
