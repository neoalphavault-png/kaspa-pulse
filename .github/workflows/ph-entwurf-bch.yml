# ph-entwurf-bch.yml - Post-Entwurf fuer @pulsehawkio nach jedem BCH-Tempnet-Lauf.
#
# Ben, 22.10.2026: nach jedem Lauf (mittwochs) ein Entwurf mit Grafik in den
# privaten Discord-Kanal. Kein Posten auf X. Das Secret
# DISCORD_WEBHOOK_PH_DRAFTS kommt nur in die Umgebung des einen Schritts, der
# sendet; die Adresse wird nie gedruckt.
#
# Ausloeser:
# - workflow_run nach "bch tempnet" (Branch messung/bch-tempnet, gruen). Gesendet
#   wird nur, wenn dieser Lauf data/bch/tempnet-<stichtag>.json geschrieben hat
#   (letzter Commit auf die Datei nach dem Start des Laufs). Ein Zwischenstand
#   oder ein Lauf ohne neue Zahlen schickt nichts. workflow_run greift erst,
#   wenn diese Datei auf main liegt.
# - push auf ph/discord-entwurf (Testlauf vor dem Merge) und workflow_dispatch:
#   immer senden, Stichtag aus der Eingabe oder data/bch/stichtag.txt.
#
# Skript aus diesem Stand (scripts/ph/ph_entwurf.py), Daten aus
# messung/bch-tempnet im Unterordner daten/. Die Regelpruefung des Texts laeuft
# vor dem Senden; bei Verstoss bricht der Lauf ab und nichts geht raus.
name: ph entwurf bch

on:
  workflow_run:
    workflows: ["bch tempnet"]
    types: [completed]
    branches: ["messung/bch-tempnet"]
  push:
    branches: ["ph/discord-entwurf"]
    paths:
      - "scripts/ph/**"
      - ".github/workflows/ph-entwurf-bch.yml"
  workflow_dispatch:
    inputs:
      stichtag:
        description: "Stichtag JJJJ-MM-TT (leer = data/bch/stichtag.txt)"
        required: false
        default: ""
      layout:
        description: "auto, verteilung oder verlauf"
        required: false
        default: "auto"

permissions:
  contents: read

concurrency:
  group: ph-entwurf-bch
  cancel-in-progress: false

jobs:
  entwurf:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: messung/bch-tempnet
          path: daten
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet matplotlib pillow

      - name: selbsttest regeln
        run: python3 scripts/ph/ph_entwurf.py --selbsttest

      - name: neuer stand
        id: stand
        env:
          EREIGNIS: ${{ github.event_name }}
          LAUF_START: ${{ github.event.workflow_run.created_at }}
          EINGABE: ${{ inputs.stichtag }}
          LAYOUT: ${{ inputs.layout }}
        run: |
          set -eu
          ST="${EINGABE:-}"
          if [ -z "$ST" ]; then ST=$(tr -d ' \n' < daten/data/bch/stichtag.txt); ST="${ST%%T*}"; fi
          case "$ST" in [0-9][0-9][0-9][0-9]-[0-1][0-9]-[0-3][0-9]) ;; *) echo "stichtag unklar"; exit 1;; esac
          case "${LAYOUT:-auto}" in auto|verteilung|verlauf) ;; *) echo "layout unklar"; exit 1;; esac
          DATEI="data/bch/tempnet-$ST.json"
          if [ ! -f "daten/$DATEI" ]; then
            echo "kein datierter stand fuer $ST, nichts zu senden"
            echo "senden=nein" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EREIGNIS" = "workflow_run" ]; then
            GESCHRIEBEN=$(git -C daten log -1 --format=%cI -- "$DATEI")
            NEU=$(python3 -c 'import sys;from datetime import datetime as d;print("ja" if d.fromisoformat(sys.argv[1])>=d.fromisoformat(sys.argv[2].replace("Z","+00:00")) else "nein")' "$GESCHRIEBEN" "$LAUF_START")
            if [ "$NEU" != "ja" ]; then
              echo "$DATEI nicht von diesem lauf geschrieben, nichts zu senden"
              echo "senden=nein" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "stand $DATEI"
          { echo "senden=ja"; echo "datei=$DATEI"; echo "layout=${LAYOUT:-auto}"; } >> "$GITHUB_OUTPUT"

      - name: entwurf bauen und senden
        if: steps.stand.outputs.senden == 'ja'
        env:
          DISCORD_WEBHOOK_PH_DRAFTS: ${{ secrets.DISCORD_WEBHOOK_PH_DRAFTS }}
          DATEI: ${{ steps.stand.outputs.datei }}
          LAYOUT: ${{ steps.stand.outputs.layout }}
        run: |
          set -eu
          python3 scripts/ph/ph_entwurf.py bch --json "daten/$DATEI" \
            --koepfe daten/data/bch/tempnet-koepfe.csv.gz --layout "$LAYOUT" --aus entwurf --senden
          { echo "## Entwurf fuer @pulsehawkio"; echo '```'; cat entwurf/text.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.stand.outputs.senden == 'ja'
        with:
          name: ph-entwurf-bch
          path: entwurf/
          retention-days: 30
