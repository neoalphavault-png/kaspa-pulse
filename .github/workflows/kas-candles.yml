# kaspa pulse - kursdaten fuer KASPA WEEKLY und den tages-lesewert
#
# bis 09.09. lief das nur sonntags um 00:40 utc, direkt nach unserem
# wochenschluss (woche endet sonntag 00:00 utc, definition steht in
# scripts/kas_candles.py). seit die number-of-the-day-automatik aus dieser
# datei rechnet (weekly_line, sats_divergence), muss sie taeglich frisch sein:
# der sats-vergleich stellt den heutigen tag gegen vor einem jahr, mit einer
# vier tage alten datei zeigt er einen alten tag.
#
# zweiter lauf deshalb taeglich 07:25 utc, also vor dem tagespost um 08:12.
# der sonntagslauf bleibt, damit der wochenschluss auf jeden fall drin ist,
# auch wenn github den taeglichen start einmal verschluckt.
name: kas candles
on:
  schedule:
    - cron: "40 0 * * 0"
    - cron: "25 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fetch candles
        run: python3 scripts/kas_candles.py --out data/kas-candles.json
      - name: commit
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add data/kas-candles.json
          git diff --cached --quiet || git commit -m "kas candles $(date -u +%F)"
          git push
