# kaspa pulse - kursdaten fuer KASPA WEEKLY und den tages-lesewert
#
# bis 09.09. lief das nur sonntags um 00:40 utc, direkt nach unserem
# wochenschluss (woche endet sonntag 00:00 utc, definition steht in
# scripts/kas_candles.py). seit die number-of-the-day-automatik aus dieser
# datei rechnet (weekly_line, sats_divergence), muss sie taeglich frisch sein:
# der sats-vergleich stellt den heutigen tag gegen vor einem jahr, mit einer
# vier tage alten datei zeigt er einen alten tag.
#
# zweiter lauf deshalb taeglich 07:25 utc, also vor dem tagespost um 08:12.
# der sonntagslauf bleibt, damit der wochenschluss auf jeden fall drin ist,
# auch wenn github den taeglichen start einmal verschluckt.
#
# AENDERUNG 02.10.2026: github startet die zeitplaene hier 5 bis 8 stunden
# spaet (gemessen 22.09. bis 01.10., geplant 07:25, gelaufen 12:42 bis
# 15:40 utc). die datei hinkte damit jeden vormittag einen tag hinterher.
# deshalb mehrere starts am tag, der erste gleich nach dem utc-tagesschluss,
# sonntags zwei mehr vor der routine um 07:00 utc. jeder lauf schreibt nur,
# wenn eine neue kerze da ist (kas_candles.py), leere commits gibt es keine.
# die minuten liegen absichtlich nicht auf :00 oder :30, dort ist github am
# vollsten.
name: kas candles
on:
  schedule:
    - cron: "40 0 * * *"
    - cron: "10 3 * * *"
    - cron: "25 7 * * *"
    - cron: "50 1 * * 0"
    - cron: "50 4 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kas-candles
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fetch candles
        run: python3 scripts/kas_candles.py --out data/kas-candles.json
      - name: commit
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add data/kas-candles.json
          if git diff --cached --quiet; then
            echo "keine neue kerze, kein commit"
          else
            git commit -m "kas candles $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
