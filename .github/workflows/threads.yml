name: threads

# Threads, ein Post am Tag um 17:10 Berlin (Ben, 17.10.2026).
#
# Der Takt kommt von c2 (takt-threads.timer), GitHubs geplante Laeufe kommen
# in diesem Konto sechs bis sieben Stunden zu spaet. Bild und Text kommen
# aus dem Artefakt des Tagesgrafik-Laufs vom Morgen: das Threads-Bild im
# eigenen Look und der X-Text (drei Zeilen, Frage am Ende). Steht in
# data/threads-queue.json ein Text fuer den Tag, geht der vor.
#
# VEROEFFENTLICHT WIRD NUR MIT ZWEI SCHALTERN, wie bei Instagram: der Takt
# schickt modus=scharf (THREADS_LIVE in takt.conf) UND die Variable
# THREADS_LIVE steht auf "scharf". Ein Lauf von Hand (modus=trocken) legt
# nur den Container an und veroeffentlicht nie. Der Token kommt nur als
# Secret THREADS_TOKEN in den einen Schritt, der ihn braucht.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "trocken = von hand, nur container. scharf = takt von c2"
        type: choice
        options:
          - trocken
          - scharf
        default: trocken

permissions:
  contents: write
  actions: read

concurrency:
  group: threads
  cancel-in-progress: false

jobs:
  threads:
    runs-on: ubuntu-24.04
    # 45 statt 30: die wartezeit auf das bild ist 1500 s (Ben, 6.11.2026)
    timeout-minutes: 45
    env:
      # --takt behaelt Zeitfenster und Tagessperre, --hand laesst beide weg
      # und ist nie scharf
      TH_START: ${{ inputs.modus == 'scharf' && '--takt' || '--hand' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pillow
        run: "pip install --only-binary=:all: pillow==11.3.0"
      - name: selbsttest
        run: python3 scripts/threads.py --selbsttest
      - name: log nachholen
        # Ben, 5.11.2026: ein Post, dessen Log-Eintrag nicht gepusht werden
        # konnte, kommt hier ueber die Threads-API zurueck ins Log, bevor
        # die Tagessperre gelesen wird. Ein Fehler hier haelt den Post nicht auf.
        continue-on-error: true
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
        run: python3 scripts/threads.py nachholen
      - name: grafik aus dem 07:30-lauf
        id: a
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/threads.py artefakt $TH_START --ziel out/th
      - name: jpeg
        id: j
        if: steps.a.outputs.faellig == '1' && steps.a.outputs.gefunden == '1'
        env:
          PNG: ${{ steps.a.outputs.png }}
        run: python3 scripts/instagram.py jpeg --png "$PNG" --ziel ig
      - name: jpeg committen, bild bereitstellen
        id: b
        if: steps.a.outputs.faellig == '1' && steps.a.outputs.gefunden == '1'
        env:
          JPEG: ${{ steps.j.outputs.jpeg }}
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add "$JPEG" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "jpeg schon im repo"
          else
            git commit -m "threads bild [bot]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
          # threads holt das bild ueber die raw-adresse des bild-commits
          # (Ben, 6.11.2026), 120 s. kaspapulse.com ist nur der rueckfall mit
          # 1500 s, am 4.11. und 6.11. hing dort das pages-deploy.
          python3 scripts/threads.py bild --jpeg "$JPEG"
      - name: container, status, veroeffentlichen nur wenn scharf
        id: p
        if: steps.a.outputs.faellig == '1' && steps.a.outputs.gefunden == '1'
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ vars.THREADS_USER_ID }}
          THREADS_LIVE: ${{ vars.THREADS_LIVE }}
          MODUS: ${{ inputs.modus }}
          BILD: ${{ steps.b.outputs.bild }}
          TEXT: ${{ steps.a.outputs.text }}
        run: |
          HAND=""; [ "$TH_START" = "--hand" ] && HAND="--hand"
          python3 scripts/threads.py posten --bild "$BILD" --text-datei "$TEXT" --modus "$MODUS" $HAND
      - name: probe, nimmt instagram dieselbe adresse
        # nur im handlauf und nur mit der raw-adresse (Ben, 6.11.2026): ein
        # instagram-container mit demselben bild, ohne caption, NIE
        # veroeffentlicht. FINISHED heisst, meta nimmt die raw-adresse auch
        # fuer instagram, dann kann instagram.IG_RAW umgestellt werden.
        if: inputs.modus == 'trocken' && steps.b.outputs.quelle == 'raw'
        continue-on-error: true
        env:
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          BILD: ${{ steps.b.outputs.bild }}
        run: python3 scripts/instagram.py quelle-probe --bild "$BILD"
      - name: log sichern
        # pull --rebase vor jedem push, bis zu drei wiederholungen nach 10, 20
        # und 40 s (Ben, 5.11.2026). Scheitert der push nach einem post, bleibt
        # der schritt gruen, nach #ops-log geht "threads gepostet, log nicht
        # gesichert", und "log nachholen" holt den eintrag beim naechsten lauf.
        id: l
        if: always()
        env:
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          VEROEFFENTLICHT: ${{ steps.p.outputs.veroeffentlicht }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          python3 scripts/threads.py log-sichern --veroeffentlicht "$VEROEFFENTLICHT" --lauf "$LAUF"
      - name: rot nach ops-log
        # "kein post" nur, wenn wirklich nicht veroeffentlicht wurde
        if: failure()
        env:
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          VEROEFFENTLICHT: ${{ steps.p.outputs.veroeffentlicht }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' || true
          import os, sys
          sys.path.insert(0, "scripts")
          import ops_melden
          if os.environ.get("VEROEFFENTLICHT") == "1":
              text = "threads gepostet, der lauf ist trotzdem rot\n"
          else:
              text = "threads ist rot, heute kein post\n"
          ops_melden.log(text + os.environ.get("LAUF", ""), was="rot")
          PY
