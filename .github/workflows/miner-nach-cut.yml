# Kaspa Pulse - "Miner nach dem Cut", Aufzeichnung (Ben, 02.11. und 03.11.2026)
#
# Liegt bewusst NUR auf dem Branch messung/miner-nach-cut. Nicht gemergt.
# Ein Push von miner/start.txt startet eine Kette von 24 Laeufen (miner-lauf.yml),
# dazwischen je ein Wartejob von 5 h 30 min ohne Abfragen. Jeder Lauf liest die
# Kette ab dem Stand des vorigen, so bleibt das Fenster lueckenlos, solange
# zwischen zwei Laeufen weniger als rund 30 h liegen. Ein gescheiterter Lauf
# haelt die Kette nicht an, der naechste liest dann mit ab.

name: miner nach cut

on:
  push:
    branches:
      - messung/miner-nach-cut
    paths:
      - miner/start.txt

permissions:
  contents: write

concurrency:
  group: miner-nach-cut
  cancel-in-progress: false

jobs:
  l01:
    uses: ./.github/workflows/miner-lauf.yml
    with:
      nr: "01"

  w01:
    needs: l01
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: warten ohne abfragen
        run: sleep 19800

  l02:
    needs: w01
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/miner-lauf.yml
    with:
