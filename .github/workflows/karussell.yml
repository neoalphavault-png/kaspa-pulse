name: karussell

# Instagram-Karussell und "Meme, but true", automatisch (Ben, 25.10.2026).
# Jeder Termin laeuft in zwei Schritten, beide vom Takt auf c2:
#
#   entwurf  2 Stunden vor dem Post. Bilder und Caption nach #ops-log
#            mit "geht um HH:MM raus, Veto: karussell-stopp", alles als
#            Artefakt karussell-entwurf-<art>-<datum>, Look im Raster gemerkt.
#   posten   zum Termin. Holt genau die Bilder aus dem Entwurf, legt sie kurz
#            in kaspapulse-media ab (wie die Reels) und postet ueber die
#            Graph API, ein Karussell bis 10 Seiten oder ein Einzelbild.
#   probe    beides in einem Lauf, nie veroeffentlicht, nichts gemerkt. Der
#            Vorschau-Lauf vor dem Scharfschalten.
#
# SCHARF nur mit start=takt UND der Variable KARUSSELL_LIVE=true, im Fenster
# um die Postzeit und ohne Stopp. Von Hand ist immer trocken. Notbremse:
# Variable KARUSSELL_STOPP auf JJJJ-MM-TT oder immer.
#
# Termine: woche Sa 11:00, story Mi 18:00, meme Sa 15:00 (Berlin), Entwurf je
# 2 Stunden vorher. Die Logik steht in scripts/karussell_post.py.

on:
  workflow_dispatch:
    inputs:
      art:
        description: "woche (sa 11:00), story (mi 18:00) oder meme (sa 15:00)"
        type: choice
        options:
          - woche
          - story
          - meme
        default: woche
      schritt:
        description: "entwurf (2 h vorher), posten (zum termin) oder probe (beides, nie veroeffentlicht)"
        type: choice
        options:
          - entwurf
          - posten
          - probe
        default: probe
      fuer:
        description: "post-datum JJJJ-MM-TT, leer = der termin heute oder der naechste"
        required: false
        default: ""
      start:
        description: "hand (immer trocken) oder takt (darf scharf sein, setzt nur c2)"
        type: choice
        options:
          - hand
          - takt
        default: hand

permissions:
  contents: write
  actions: read

concurrency:
  group: karussell-${{ inputs.art }}
  cancel-in-progress: false

jobs:
  karussell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ART: ${{ inputs.art }}
      FUER: ${{ inputs.fuer }}
      START: ${{ inputs.start }}
      SCHRITT: ${{ inputs.schritt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pakete
        run: |
          python -m pip install --upgrade pip
          pip install "playwright" "pillow==11.3.0"
          if [ "$SCHRITT" != "posten" ]; then python -m playwright install --with-deps chromium; fi
      - name: eingaben
        id: e
        run: |
          if [ -n "$FUER" ]; then
            case "$FUER" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "fuer muss JJJJ-MM-TT sein"; exit 1;; esac
          fi
          python3 scripts/karussell_post.py datum --art "$ART" --fuer "$FUER"
      - name: selbsttest
        run: |
          python3 scripts/karussell.py --selbsttest
          python3 scripts/meme_wahr.py --selbsttest
          python3 scripts/karussell_post.py --selbsttest
      - name: entwurf
        id: w
        if: inputs.schritt != 'posten'
        env:
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          KARUSSELL_STOPP: ${{ vars.KARUSSELL_STOPP }}
          PROBE: ${{ inputs.schritt == 'probe' && '--probe' || '' }}
          F: ${{ steps.e.outputs.fuer }}
        run: python3 scripts/karussell_post.py entwurf --art "$ART" --fuer "$F" --out out/entwurf $PROBE
      - uses: actions/upload-artifact@v4
        if: inputs.schritt != 'posten' && steps.w.outputs.gebaut == '1'
        with:
          name: karussell-entwurf-${{ inputs.art }}-${{ steps.e.outputs.fuer }}${{ inputs.schritt == 'probe' && '-probe' || '' }}
          path: |
            out/entwurf/*.png
            out/entwurf/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: look sichern
        if: inputs.schritt == 'entwurf' && steps.w.outputs.gebaut == '1'
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add data/look-takt.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "look-takt unveraendert, kein commit"
          else
            git commit -m "karussell look [bot]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: posten
        if: inputs.schritt == 'posten' || (inputs.schritt == 'probe' && steps.w.outputs.gebaut == '1')
        env:
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          GITHUB_TOKEN: ${{ github.token }}
          KARUSSELL_LIVE: ${{ vars.KARUSSELL_LIVE }}
          KARUSSELL_STOPP: ${{ vars.KARUSSELL_STOPP }}
          F: ${{ steps.e.outputs.fuer }}
        run: |
          if [ "$SCHRITT" = "probe" ]; then
            python3 scripts/karussell_post.py posten --art "$ART" --fuer "$F" --quelle out/entwurf --start hand --probe
          else
            python3 scripts/karussell_post.py posten --art "$ART" --fuer "$F" --start "$START"
          fi
      - name: log sichern
        if: always() && inputs.schritt == 'posten'
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add data/karussell-log.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "log unveraendert, kein commit"
            exit 0
          fi
          git commit -m "karussell log [bot]"
          for N in 1 2 3; do
            git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "push $N fehlgeschlagen"
            sleep "$N"
          done
          echo "::error::karussell-log nicht gepusht, der naechste lauf koennte denselben termin noch einmal posten"
          exit 1
      - name: rot nach ops-log
        if: failure()
        env:
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' || true
          import os, sys
          sys.path.insert(0, "scripts")
          import ops_melden
          text = "karussell %s %s ist rot, nichts gepostet\n%s" % (os.environ.get("ART", ""), os.environ.get("SCHRITT", ""), os.environ.get("LAUF", ""))
          ops_melden.log(text, was="rot")
          PY
