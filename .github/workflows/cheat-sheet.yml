name: cheat sheet

# Das Cheat Sheet "the 8 kaspa numbers whales watch", einmal im Monat neu
# gebaut aus unseren eigenen Reihen (Ben, 11.10.2026). Edition 1 ist von Hand
# entstanden, ab Edition 2 baut scripts/cheat_sheet.py.
#
# Der Workflow veroeffentlicht NICHTS. PDF und Deckblatt gehen als
# "📤 VON HAND" ueber DISCORD_WEBHOOK_OPS nach #moderator-only (ist
# CHEAT_SHEET_LIVE scharf, nur zur Info nach #ops-log), dazu je Zahl ihr Stichtag und
# wie alt er ist. Ben sieht nach und stellt die Variable CHEAT_SHEET_LIVE auf
# "scharf", wenn die Datei unter kaspapulse.com/kaspa-pulse-cheat-sheet.pdf
# ersetzt werden soll. Erst dann wird committet und erst dann verbraucht der
# Lauf eine Ausgabe-Nummer.
#
# Am 1. jeden Monats, 09:00 Berlin, sommer- und winterzeitfest wie die
# Tagesgrafik: zwei Termine, 07:00 UTC und 08:00 UTC. Der Lauf prueft die
# Berliner Stunde und endet gruen ohne Bau, wenn er der falsche Termin ist.
# Den Takt gibt sonst c2 (deploy/c2/taktgeber), dieser Cron ist der Ersatz.
#
# Ab Edition 2 baut der scharfe Lauf auch kaspapulse.com/whales neu (2 Zahlen
# offen, 6 gesperrt) und committet sie mit dem PDF. whales_probe baut nur die
# Seite, frisch gemessen, und schickt die Vorschau nach #ops-log.
#
# Ein Lauf bricht ab, wenn eine der acht Zahlen fehlt oder ihr Stichtag
# aelter als zehn Tage ist. Das ist gewollt: lieber kein PDF als eines mit
# neuem Monat und alter Zahl.

on:
  schedule:
    - cron: "0 7 1 * *"
    - cron: "0 8 1 * *"
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "die datei der webseite ersetzen (braucht CHEAT_SHEET_LIVE=scharf)"
        type: boolean
        default: false
      edition:
        description: "ausgabe-nummer erzwingen, leer = log + 1"
        required: false
        default: ""
      aus_probe:
        description: "aus der festen probe bauen, ohne netz (nur zum pruefen)"
        type: boolean
        default: false
      whales_probe:
        description: "nur die seite /whales frisch bauen, vorschau 390 px nach #ops-log, nichts schreiben"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cheat-sheet
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      # scharf nur mit der variable UND nur wenn der lauf es verlangt
      SCHARF: ${{ (vars.CHEAT_SHEET_LIVE == 'scharf' && (github.event_name == 'schedule' || inputs.veroeffentlichen)) && 'ja' || 'nein' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: selbsttest
        run: python3 scripts/cheat_sheet.py --selbsttest
      - name: termin pruefen
        id: t
        run: |
          STUNDE=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$STUNDE" != "09" ]; then
            echo "es ist $STUNDE:00 Berlin, gebaut wird um 09:00. nichts zu tun"
            echo "dran=0" >> "$GITHUB_OUTPUT"
          else
            echo "dran=1" >> "$GITHUB_OUTPUT"
          fi
      # /whales ab edition 2 (Ben, 29.10.2026): probe ohne pdf, ohne commit,
      # nur nach #ops-log. EDITION leer = 2.
      - name: whales probe
        if: steps.t.outputs.dran == '1' && inputs.whales_probe
        env:
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          EDITION: ${{ inputs.edition }}
        run: |
          E="${EDITION:-2}"
          case "$E" in *[!0-9]*) echo "edition muss eine zahl sein"; exit 1;; esac
          python3 scripts/whales_seite.py --selbsttest
          python3 scripts/whales_seite.py --probe --edition "$E" --out graphics/whales-probe
      - name: bauen und melden
        if: steps.t.outputs.dran == '1' && !inputs.whales_probe
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          EDITION: ${{ inputs.edition }}
          AUS_PROBE: ${{ inputs.aus_probe }}
        run: |
          ARGS="--bauen --melden"
          if [ "$SCHARF" = "ja" ]; then ARGS="--veroeffentlichen --melden"; fi
          if [ -n "$EDITION" ]; then
            case "$EDITION" in ''|*[!0-9]*) echo "edition muss eine zahl sein"; exit 1;; esac
            ARGS="$ARGS --edition $EDITION"
          fi
          # eine probe ist zum pruefen da, nie fuer die webseite
          if [ "$AUS_PROBE" = "true" ]; then
            ARGS="--bauen --melden --aus scripts/cheat-sheet-probe.json"
            if [ -n "$EDITION" ]; then ARGS="$ARGS --edition $EDITION"; fi
          fi
          python3 scripts/cheat_sheet.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always() && steps.t.outputs.dran == '1'
        with:
          name: cheat-sheet
          path: |
            graphics/cheat-sheet/
            graphics/whales-probe/
          if-no-files-found: ignore
          retention-days: 90
      - name: webseite und log sichern
        if: steps.t.outputs.dran == '1' && env.SCHARF == 'ja' && !inputs.whales_probe
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          # die seite /whales geht mit dem pdf live (cheat_sheet.festschreiben baut sie)
          git add kaspa-pulse-cheat-sheet.pdf data/cheat-sheet-log.json
          git add whales/index.html
          if [ -f data/whales-stand.json ]; then git add data/whales-stand.json; fi
          if git diff --staged --quiet; then
            echo "unveraendert, kein commit"
          else
            git commit -m "cheat sheet neu gebaut [bot]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: rot nach ops-log
        if: failure()
        env:
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY' || true
          import os, sys
          sys.path.insert(0, "scripts")
          import ops_melden
          text = ("cheat sheet ist rot, kein neues pdf. meist ist eine zahl zu alt, " "der grund steht im lauf\n" + os.environ.get("LAUF", ""))
          ops_melden.log(text, was="rot")
          PY
