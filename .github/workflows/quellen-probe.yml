name: quellen probe

# Nur von Hand. Beantwortet die Machbarkeitsfrage fuer neue Messreihen:
# liefert kaspalytics die drei Covenant-Reihen als JSON, und liefert
# kaspa.stream die Verteilungstabelle und die Top-Adressen? Der Lauf holt
# nichts ins Repo, er druckt nur die Rohantworten ins Log. Die Arbeitsumgebung
# selbst kommt an beide Quellen nicht heran, deshalb faellt die Antwort hier.
#
# Die drei Runden bauen aufeinander auf und sind absichtlich alle drei
# geblieben. Am 22.09.2026 hat Runde eins zwei von drei Kaspalytics-Reihen
# gefunden, Runde zwei die dritte (sie liegt unter /utxo/, nicht unter
# /covenants/), und Runde drei hat gezeigt, dass kaspa.stream gar keinen
# HTTP-Endpunkt hat. Wer die Frage spaeter noch einmal stellt, soll nicht
# bei null anfangen muessen.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: runde 1, welche endpunkte antworten
        run: python3 scripts/quellen_probe.py
      - name: runde 2, was die seiten selbst aufrufen
        run: python3 scripts/quellen_probe2.py
      - name: runde 3, adressen aus den skriptbuendeln
        run: python3 scripts/quellen_probe3.py
      - name: runde 4, die offene holders-quelle aus week-input.json
        run: python3 scripts/holders_quelle.py
      - name: runde 5, distributionstabelle und die zeitstempel der bestandsreihen
        run: python3 scripts/quellen_probe4.py
      - name: runde 6, die distributionstabelle gezielt
        run: python3 scripts/quellen_probe5.py
