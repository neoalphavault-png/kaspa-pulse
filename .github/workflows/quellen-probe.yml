name: quellen probe

# Nur von Hand. Fragt fremde Quellen ab und druckt die Rohantworten ins Log,
# holt nichts ins Repo. Die Arbeitsumgebung selbst kommt an kaspalytics.com
# und kaspa.stream nicht heran (Proxy antwortet 403 auf CONNECT), deshalb
# faellt jede Antwort auf diese Fragen hier.
#
# Bis zum 22.09.2026 lag je Frage eine eigene Datei im Repo, neun Stueck.
# Seit dem 23.09. ist es eine Datei mit Unterbefehlen, und was bisher
# herauskam, steht in ihrem Kopf.

on:
  workflow_dispatch:
    inputs:
      befehl:
        description: "welche frage (alle, kaspalytics, bestaende, stream, tabelle, routen, handwerte, richlist, wochen)"
        required: false
        default: "alle"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sonde
        run: python3 scripts/quellen_probe.py "${{ github.event.inputs.befehl || 'alle' }}"
