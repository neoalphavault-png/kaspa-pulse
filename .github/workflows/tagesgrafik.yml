name: tagesgrafik

# Eine Grafik pro Tag fuer X und Discord (Ben, 29.09.2026). Der Workflow
# postet NICHTS oeffentlich. PNG, Vorschau 390 px, Discord-Text, X-Text und
# die Selbstpruefung gehen ueber DISCORD_WEBHOOK_OPS nach #moderator-only.
# Ben prueft, postet Discord um 09:00 und plant X fuer 17:00.
#
# 07:30 Berlin, sommer- und winterzeitfest wie die Montagskette: zwei
# Termine. 05:30 UTC ist im Sommer 07:30 Berlin, 06:30 UTC im Winter.
# scripts/tagesgrafik.py --zeitplan liefert nur zwischen 07:00 und 12:00
# Berlin und nur einmal am Tag (data/tagesgrafik-log.json). Der jeweils
# andere Termin endet gruen ohne Lieferung: im Winter ist 05:30 UTC erst
# 06:30 Berlin, im Sommer steht der Tag um 06:30 UTC schon im Log. Faellt
# der erste Termin aus, liefert der zweite.
#
# INSTAGRAM (Ben, 08.10.2026). Job "instagram" um 09:30 Berlin, nach Discord,
# wieder zwei Termine: 07:30 UTC im Sommer, 08:30 UTC im Winter.
# scripts/instagram.py faellig laesst nur zwischen 09:25 und 11:30 Berlin durch, nur wenn die
# Grafik um 07:30 mit "senden" ausgeliefert wurde, nur einmal am Tag und nie,
# wenn die Variable IG_STOPP auf heute (JJJJ-MM-TT) oder "immer" steht. Er
# nimmt PNG und Caption aus dem Artefakt genau dieses Laufs, legt das JPEG
# unter ig/ auf kaspapulse.com und schickt es an Instagram. Veroeffentlicht
# wird nur, wenn die Variable IG_MODUS auf "scharf" steht, sonst bleibt der
# Container unveroeffentlicht (Trockenlauf). Der Token kommt nur als Secret
# INSTAGRAM_PAGE_TOKEN in die Umgebung des einen Schritts, der ihn braucht.
#
# DER TAKT VON C2 (Ben, 14.10.2026). GitHubs geplante Laeufe kommen in diesem
# Konto sechs bis sieben Stunden zu spaet, und instagram.py laesst nur zwischen
# 09:25 und 11:30 Berlin durch - der geplante Weg liefert also meist nichts.
# Der Takt kommt deshalb von c2 (takt-instagram-bild.timer, 09:30 Berlin) und
# schickt instagram=scharf mit, gesteuert von IG_LIVE in takt.conf.
#
# Ein Dispatch mit instagram=scharf laeuft als --takt: Zeitfenster und
# Tagessperre GELTEN, und veroeffentlicht wird nur, wenn ZUSAETZLICH die
# Variable IG_MODUS auf "scharf" steht. Zwei Schalter, wie beim Reel.
# Ein Dispatch mit instagram=trocken bleibt der Handstart: --hand, ohne
# Fenster, ohne Tagessperre und damit nie scharf.

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      form:
        description: "eine form von hand (1 bis 10), leer = rotation"
        required: false
        default: ""
      senden:
        description: "an #moderator-only schicken"
        type: boolean
        default: false
      instagram:
        description: "instagram aus dem 07:30-lauf, baut keine neue grafik. trocken = von hand, scharf = takt"
        type: choice
        options:
          - aus
          - trocken
          - scharf
        default: aus

permissions:
  contents: write

concurrency:
  group: tagesgrafik
  cancel-in-progress: false

jobs:
  grafik:
    # nicht zu den instagram-terminen und nicht bei einem start nur fuer
    # instagram (Ben, 08.10.2026). "!= trocken" liess den scharfen Takt vom
    # 14.10. durch und haette die Grafik um 09:30 neu gebaut - der
    # Instagram-Job nimmt sie aber aus dem Artefakt des 07:30-Laufs.
    if: >-
      (github.event_name == 'schedule' && github.event.schedule != '30 7 * * *' && github.event.schedule != '30 8 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.instagram == 'aus')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: selbsttest
        run: python3 scripts/tagesgrafik.py --selftest
      - name: grafik, geplant
        if: github.event_name == 'schedule'
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          ZIEL: ${{ vars.ZIEL }}
        run: python3 scripts/tagesgrafik.py --zeitplan --senden --log-schreiben --out graphics/tagesgrafik
      - name: grafik, von hand
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          FORM: ${{ inputs.form }}
          SENDEN: ${{ inputs.senden }}
        run: |
          ARGS="--out graphics/tagesgrafik"
          if [ -n "$FORM" ]; then
            case "$FORM" in ''|*[!0-9]*) echo "form muss eine zahl sein"; exit 1;; esac
            ARGS="$ARGS --form $FORM"
          fi
          # geschickt ist geliefert, also ins log wie beim cron (Ben, 01.10.2026)
          if [ "$SENDEN" = "true" ]; then ARGS="$ARGS --senden --log-schreiben"; fi
          python3 scripts/tagesgrafik.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tagesgrafik
          path: graphics/tagesgrafik/
          if-no-files-found: ignore
          retention-days: 14
      - name: log sichern
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.senden)
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          # JE DATEI EIN EIGENES git add (Ben, 16.10.2026): ein gemeinsames
          # add bricht ganz ab, sobald eine Datei fehlt, und dann ist NICHTS
          # vorgemerkt. look-takt.json ist der Speicher des Look-Takts.
          git add data/tagesgrafik-log.json 2>/dev/null || true
          git add data/look-takt.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "log unveraendert, kein commit"
          else
            git commit -m "tagesgrafik log [bot]"
            # der eigene branch, nicht main: ein handlauf von einem fix-branch
            # lief sonst am 03.10. in einen add/add-konflikt (lauf 37119999946)
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: ops bei rot
        if: failure()
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          hook = os.environ.get("DISCORD_WEBHOOK_OPS", "")
          text = "tagesgrafik ist rot, keine grafik heute\n" + os.environ.get("LAUF", "")
          print(text)
          if hook:
              req = urllib.request.Request(hook, data=json.dumps({"content": text,
                    "allowed_mentions": {"parse": []}}).encode(), headers={
                    "Content-Type": "application/json", "User-Agent": "kaspa-pulse-bot"})
              urllib.request.urlopen(req, timeout=30)
          PY

  instagram:
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '30 7 * * *' || github.event.schedule == '30 8 * * *'))
      || (github.event_name == 'workflow_dispatch' && inputs.instagram != 'aus')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      # Scharf nur mit der Variable, und nur auf zwei Wegen: geplant, oder als
      # Takt (instagram=scharf). Der Handstart (instagram=trocken) bleibt
      # trocken, auch wenn die Variable scharf steht.
      IG_MODUS: >-
        ${{ (vars.IG_MODUS == 'scharf'
             && (github.event_name == 'schedule'
                 || (github.event_name == 'workflow_dispatch' && inputs.instagram == 'scharf')))
            && 'scharf' || 'trocken' }}
      # --hand laesst Zeitfenster und Tagessperre weg und darf nie scharf
      # sein. --takt behaelt beide. Geplante Laeufe brauchen keinen Schalter.
      # ACHTUNG, REIHENFOLGE. Ein leerer String ist in GitHub-Ausdruecken
      # falsch, also faellt "bedingung && '' || rest" immer auf rest durch.
      # Der leere Fall muss deshalb hinten stehen, sonst bekaeme ein
      # geplanter Lauf --hand und koennte nicht mehr scharf sein.
      IG_HAND: >-
        ${{ github.event_name == 'workflow_dispatch'
            && (inputs.instagram == 'scharf' && '--takt' || '--hand')
            || '' }}
      # ZIEL=moderator (Design-Runde, 16.10.2026): Trockenlauf, gepostet
      # wird nur nach #moderator-only. Leer = normal.
      ZIEL: ${{ vars.ZIEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pillow
        run: "pip install --only-binary=:all: pillow==11.3.0"
      - name: selbsttest
        run: python3 scripts/instagram.py --selbsttest
      - name: faellig
        id: f
        env:
          IG_STOPP: ${{ vars.IG_STOPP }}
        run: python3 scripts/instagram.py faellig $IG_HAND --ziel out/ig
      - name: grafik aus dem 07:30-lauf
        id: a
        if: steps.f.outputs.faellig == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/instagram.py artefakt --ziel out/ig
      - name: jpeg
        id: j
        if: steps.f.outputs.faellig == '1' && steps.a.outputs.gefunden == '1'
        env:
          PNG: ${{ steps.a.outputs.png }}
        run: python3 scripts/instagram.py jpeg --png "$PNG" --ziel ig
      - name: jpeg auf kaspapulse.com
        if: steps.f.outputs.faellig == '1' && steps.a.outputs.gefunden == '1'
        env:
          JPEG: ${{ steps.j.outputs.jpeg }}
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add "$JPEG"
          if git diff --staged --quiet; then
            echo "jpeg schon im repo"
          else
            git commit -m "instagram bild [bot]"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: container, status, veroeffentlichen nur wenn scharf
        if: steps.f.outputs.faellig == '1' && steps.a.outputs.gefunden == '1'
        env:
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          JPEG: ${{ steps.j.outputs.jpeg }}
          CAPTION: ${{ steps.a.outputs.caption }}
        run: python3 scripts/instagram.py posten $IG_HAND --bild "$JPEG" --caption "$CAPTION" --modus "$IG_MODUS"
      - name: log sichern
        if: always() && steps.f.outputs.faellig == '1' && steps.a.outputs.gefunden == '1'
        run: |
          # JE DATEI EIN EIGENES git add. Ein gemeinsames "git add a b"
          # bricht ganz ab, sobald eine der beiden fehlt, und dann ist
          # NICHTS vorgemerkt: der Schritt committet still nichts.
          git add data/instagram-log.json 2>/dev/null || true
          git add data/insights/manifest.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "log unveraendert, kein commit"
            exit 0
          fi
          git commit -m "instagram log [bot]"
          # Beide Dateien ZUERST beiseitelegen, aus dem sauberen Stand nach
          # dem Commit. Nach einem gescheiterten Rebase stehen Konfliktmarken
          # drin, eine Kopie von dann waere Muell.
          rm -rf /tmp/ig-eigen && mkdir -p /tmp/ig-eigen
          cp data/instagram-log.json /tmp/ig-eigen/ 2>/dev/null || true
          cp data/insights/manifest.jsonl /tmp/ig-eigen/ 2>/dev/null || true
          OK=nein
          for N in 1 2 3; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME"; then
              :
            else
              echo "rebase-konflikt, eintraege werden vereint"
              git rebase --abort 2>/dev/null || true
              git reset --hard -q "origin/$GITHUB_REF_NAME" 2>/dev/null || true
              python3 - <<'EOF'
          import json, pathlib
          eigen = pathlib.Path("/tmp/ig-eigen")
          # manifest.jsonl waechst nur, also beide seiten behalten, ohne dopplung
          q = eigen / "manifest.jsonl"
          if q.exists():
              z = pathlib.Path("data/insights/manifest.jsonl")
              z.parent.mkdir(parents=True, exist_ok=True)
              kennt = set(z.read_text(encoding="utf-8").splitlines() if z.exists() else [])
              neu = [l for l in q.read_text(encoding="utf-8").splitlines()
                     if l.strip() and l not in kennt]
              if neu:
                  with open(z, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(neu) + "\n")
              print("manifest.jsonl: %d zeilen dazu" % len(neu))
          # instagram-log.json ist ein objekt mit einer liste, vereint nach media
          q = eigen / "instagram-log.json"
          if q.exists():
              z = pathlib.Path("data/instagram-log.json")
              fern = json.loads(z.read_text(encoding="utf-8")) if z.exists() else {"posts": []}
              da = {p.get("media") for p in fern.get("posts", []) if p.get("media")}
              dazu = [p for p in json.loads(q.read_text(encoding="utf-8")).get("posts", [])
                      if p.get("media") and p["media"] not in da]
              fern.setdefault("posts", []).extend(dazu)
              z.write_text(json.dumps(fern, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
              print("instagram-log.json: %d eintrag(e) dazu" % len(dazu))
          EOF
              git add data/instagram-log.json 2>/dev/null || true
              git add data/insights/manifest.jsonl 2>/dev/null || true
              git diff --staged --quiet || git commit -m "instagram log [bot]"
            fi
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then OK=ja; break; fi
            echo "push $N fehlgeschlagen"
            sleep "$N"
          done
          if [ "$OK" = "ja" ]; then
            echo "log und manifest sind auf $GITHUB_REF_NAME"
          else
            echo "::warning::log und manifest nicht gepusht, sie liegen als artefakt bereit"
            mkdir -p artefakt && cp -r /tmp/ig-eigen artefakt/instagram || true
          fi
      - name: ops bei rot
        if: failure()
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          LAUF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          hook = os.environ.get("DISCORD_WEBHOOK_OPS", "")
          text = "instagram ist rot, heute kein post\n" + os.environ.get("LAUF", "")
          print(text)
          if hook:
              req = urllib.request.Request(hook, data=json.dumps({"content": text,
                    "allowed_mentions": {"parse": []}}).encode(), headers={
                    "Content-Type": "application/json", "User-Agent": "kaspa-pulse-bot"})
              urllib.request.urlopen(req, timeout=30)
          PY
