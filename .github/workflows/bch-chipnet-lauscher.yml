# bch-chipnet-lauscher.yml - Zuhoerer im BCH Chipnet (Ben, 17.11.2026).
#
# Derselbe Zuhoerer wie im Tempnet (scripts/bch/tempnet_lauscher.py --netz
# chipnet): Peers aus BCHN chainparams (CChipNetParams, scripts/bch/
# chipnet_koepfe.py), ein Peer zaehlt nur, wenn er nach 327.988 NICHT den
# Tempnet-Block liefert. Kein eigener Knoten, ein Netzwerkpfad (der des
# Runners). Peers heissen peer_1, peer_2 usw.; die Software-Kennung ist vor der
# ersten Klammer gekuerzt (#327). Keine Adresse und kein Hostname in Daten oder
# Log. Kein Secret ausser dem GITHUB_TOKEN fuer den naechsten Lauf.
#
# Kette von Laeufen wie im Tempnet: je Lauf bis zu dauer_min, 8 min vor dem
# Ende startet der naechste auf demselben Branch (faellt der weg, auf main).
# Schluss bei bis_utc. Rohdaten je Lauf auf messung/bch-chipnet-xo unter
# data/bch-chipnet/lauscher/<lauf>/, danach Chipnet-Kette abrufen und alle
# Laeufe auswerten (bloecke.csv, zusammenfassung.json).
#
# Probe (Ben 17.11.2026 erlaubt): ein Push auf bch/chipnet-lauscher startet die
# Kette vor dem Merge; sie schreibt nur auf den Datenbranch, nie auf main.
name: bch chipnet lauscher

on:
  push:
    branches: ["bch/chipnet-lauscher"]
    paths:
      - ".github/workflows/bch-chipnet-lauscher.yml"
  workflow_dispatch:
    inputs:
      dauer_min:
        description: "Minuten zuhoeren je Lauf, hoechstens 330"
        default: "330"
      bis_utc:
        description: "Kein neuer Lauf, wenn das Ende danach laege"
        default: "2026-12-31T00:00:00Z"

permissions:
  contents: write
  actions: write

env:
  DATEN_BRANCH: messung/bch-chipnet-xo
  DATEN_DIR: data/bch-chipnet/lauscher

jobs:
  lauschen:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: messung/bch-chipnet-xo
          path: daten

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: eingaben
        id: ein
        env:
          EREIGNIS: ${{ github.event_name }}
          DAUER: ${{ inputs.dauer_min }}
          BIS: ${{ inputs.bis_utc }}
        run: |
          set -eu
          if [ "$EREIGNIS" = "push" ]; then
            DAUER=330; BIS=2026-12-31T00:00:00Z
          fi
          case "$DAUER" in ''|*[!0-9]*) echo "dauer_min unklar"; exit 1;; esac
          [ "$DAUER" -le 330 ] || { echo "dauer_min ueber 330"; exit 1; }
          case "$BIS" in [0-9][0-9][0-9][0-9]-[0-1][0-9]-[0-3][0-9]T[0-2][0-9]:[0-5][0-9]:[0-5][0-9]Z) ;; *) echo "bis_utc unklar"; exit 1;; esac
          LAUF=$(date -u +%Y%m%dT%H%M)
          { echo "dauer=$DAUER"; echo "bis=$BIS"; echo "lauf=$LAUF"; } >> "$GITHUB_OUTPUT"
          echo "lauf $LAUF, $DAUER min, bis $BIS"

      - name: uhr synchron abwarten
        continue-on-error: true
        run: |
          START=$(date +%s)
          if command -v chronyc >/dev/null 2>&1; then
            # 13 Versuche im Abstand von 10 s, also hoechstens 120 s; Ausgabe verwerfen (Referenz-ID)
            if timeout 125 chronyc waitsync 13 0 0 10 >/dev/null 2>&1; then OK='"ja"'; else OK='"nein"'; fi
            Q="chronyc waitsync"
          else
            OK='"unbekannt"'; Q="kein chronyc"
          fi
          W=$(( $(date +%s) - START ))
          echo "{\"synchron_beim_start\": $OK, \"gewartet_s\": $W, \"hoechstens_s\": 120, \"quelle\": \"$Q\"}" > "$RUNNER_TEMP/uhr-sync.json"
          cat "$RUNNER_TEMP/uhr-sync.json"

      - name: uhr am anfang
        continue-on-error: true
        run: |
          python3 scripts/bch/uhr_versatz.py > "$RUNNER_TEMP/uhr-anfang.json" \
            || echo '{"versatz": "nicht verfügbar"}' > "$RUNNER_TEMP/uhr-anfang.json"
          cat "$RUNNER_TEMP/uhr-anfang.json"

      - name: zuhoeren und naechsten lauf starten
        env:
          GH_TOKEN: ${{ github.token }}
          DAUER: ${{ steps.ein.outputs.dauer }}
          BIS: ${{ steps.ein.outputs.bis }}
        run: |
          set -eu
          python3 scripts/bch/tempnet_lauscher.py --netz chipnet --dauer "$DAUER" --aus "$RUNNER_TEMP/lauf" &
          PID=$!
          # Ben 27.11.2026: Aufrufe der GitHub-API fuer den naechsten Lauf bei 5xx
          # oder Zeitueberschreitung (30 s je Versuch) bis zu fuenfmal, mit 15, 30,
          # 60 und 120 s Abstand, zusammen hoechstens 375 s der 8 min vor Laufende.
          # Je Versuch eine Zeile im Log, nur Versuch, Ziel und Fehlerart (keine
          # Ausgabe von gh, die enthaelt die URL der API). Scheitern alle Versuche,
          # schreibt der Schritt eine Marke; der Lauf wird trotzdem zu Ende gehoert
          # und committet, und der letzte Schritt endet rot.
          api() {  # $1 = was, Rest = gh-Befehl; Ausgabe von gh nach $RUNNER_TEMP/api-aus
            WAS=$1; shift
            for V in 1 2 3 4 5; do
              if timeout 30 "$@" > "$RUNNER_TEMP/api-aus" 2> "$RUNNER_TEMP/api-fehler"; then
                echo "naechster lauf: $WAS, versuch $V von 5, ok"; return 0
              else
                RC=$?
              fi
              if [ "$RC" -eq 124 ]; then ART="zeitueberschreitung"
              else ART=$(grep -oE 'HTTP [0-9]{3}' "$RUNNER_TEMP/api-fehler" | head -n 1 || true); ART=${ART:-"fehler ohne http-code"}; fi
              echo "naechster lauf: $WAS, versuch $V von 5, $ART"
              case "$ART" in
                zeitueberschreitung|"HTTP 5"*) [ "$V" -lt 5 ] && sleep $(( 15 * (1 << (V - 1)) )) ;;
                *) return 2 ;;   # 4xx und andere: nicht wiederholen
              esac
            done
            return 1
          }
          if [ "$DAUER" -gt 15 ]; then
            sleep $(( (DAUER - 8) * 60 ))
            ENDE=$(( $(date +%s) + 8 * 60 ))
            if [ "$ENDE" -ge "$(date -d "$BIS" +%s)" ]; then
              echo "naechster lauf: nein, bis_utc erreicht"
            elif ! api "laeufe pruefen" gh run list --workflow bch-chipnet-lauscher.yml --json status,databaseId \
                     --jq "[.[] | select((.status==\"queued\" or .status==\"in_progress\") and .databaseId != $GITHUB_RUN_ID)] | length"; then
              touch "$RUNNER_TEMP/folgelauf-fehlgeschlagen"
            elif [ "$(cat "$RUNNER_TEMP/api-aus")" != "0" ]; then
              echo "naechster lauf: nein, ein anderer lauf ist schon aktiv"
            elif api "start auf $GITHUB_REF_NAME" gh workflow run bch-chipnet-lauscher.yml --ref "$GITHUB_REF_NAME" -f dauer_min="$DAUER" -f bis_utc="$BIS"; then
              echo "naechster lauf: gestartet auf $GITHUB_REF_NAME"
            elif [ "$GITHUB_REF_NAME" != "main" ] && api "start auf main" gh workflow run bch-chipnet-lauscher.yml --ref main -f dauer_min="$DAUER" -f bis_utc="$BIS"; then
              echo "naechster lauf: gestartet auf main"
            else
              touch "$RUNNER_TEMP/folgelauf-fehlgeschlagen"
            fi
          fi
          wait $PID

      - name: uhr am ende
        continue-on-error: true
        run: |
          python3 scripts/bch/uhr_versatz.py > "$RUNNER_TEMP/uhr-ende.json" \
            || echo '{"versatz": "nicht verfügbar"}' > "$RUNNER_TEMP/uhr-ende.json"
          cat "$RUNNER_TEMP/uhr-ende.json"

      # Rohdaten sofort sichern (Lehre aus dem Zcash-Testnet, 17.10.2026)
      - name: rohdaten committen
        env:
          LAUF: ${{ steps.ein.outputs.lauf }}
        run: |
          set -eu
          O="daten/data/bch-chipnet/lauscher/$LAUF"
          mkdir -p "$O"
          for n in ereignisse koepfe compact; do gzip -n -c "$RUNNER_TEMP/lauf/$n.jsonl" > "$O/$n.jsonl.gz"; done
          cp "$RUNNER_TEMP/lauf/meta.json" "$O/meta.json"
          python3 - "$O/meta.json" "$RUNNER_TEMP/uhr-anfang.json" "$RUNNER_TEMP/uhr-ende.json" "$RUNNER_TEMP/uhr-sync.json" <<'PY' || echo "::warning::uhr nicht ins meta.json geschrieben"
          import json, sys
          pfad, *uhr = sys.argv[1:]
          def lesen(p):
              try:
                  return json.load(open(p))
              except (OSError, ValueError):
                  return {"versatz": "nicht verfügbar"}
          meta = json.load(open(pfad))
          meta["uhr"] = {"anfang": lesen(uhr[0]), "ende": lesen(uhr[1])}
          if not any("quelle" in v for v in meta["uhr"].values()):
              meta["versatz"] = "nicht verfügbar"
          try:
              warten = json.load(open(uhr[2]))
          except (OSError, ValueError):
              warten = {"synchron_beim_start": "unbekannt"}
          meta["uhr"]["synchron_beim_start"] = warten.pop("synchron_beim_start", "unbekannt")
          meta["uhr"]["warten"] = warten
          json.dump(meta, open(pfad, "w"), indent=2, ensure_ascii=False)
          PY
          scripts/bch/daten_committen.sh "bch chipnet: zuhoerer lauf $LAUF [bot]"

      - name: kette danach abrufen
        run: |
          set -eu
          python3 scripts/bch/chipnet_koepfe.py --aus "$RUNNER_TEMP/kette.csv.gz" --meta "$RUNNER_TEMP/kette-meta.json"

      - name: auswerten ueber alle laeufe
        run: |
          set -eu
          L=daten/data/bch-chipnet/lauscher
          python3 scripts/bch/lauscher_auswertung.py --laeufe $(ls -d $L/2*/ | sort) \
            --kette "$RUNNER_TEMP/kette.csv.gz" --aus $L/zusammenfassung.json --csv $L/bloecke.csv
          {
            echo "## BCH Chipnet Zuhoerer"
            echo '```'
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));[print(k, json.dumps(d[k], ensure_ascii=False)) for k in ("abgedeckt_h","kettenbloecke","davon_angekuendigt_gesehen","first_seen_typ","timestamp_deviation_s","propagation_spread_ms","compact","peer_software")];print("stale", d["stale"]["anzahl"], d["stale"]["anteil_prozent"])' $L/zusammenfassung.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/bch/daten_committen.sh "bch chipnet: zuhoerer auswertung [bot]"

      - name: naechster lauf gestartet
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/folgelauf-fehlgeschlagen" ]; then
            echo "::error::Der naechste Lauf liess sich nicht starten, auch nicht mit Wiederholung (Zeilen naechster lauf im Schritt zuhoeren). Die Kette endet mit diesem Lauf, neu starten per workflow_dispatch."
            exit 1
          fi
          echo "naechster lauf: in ordnung"
