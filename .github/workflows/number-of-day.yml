name: number of the day
on:
  workflow_dispatch:
  schedule:
    # 08:12 UTC = 10:12 DE. bewusst nicht zur vollen stunde.
    - cron: "12 8 * * *"
    # nachzuegler um 09:42 UTC, falls github den ersten start verschluckt
    # (passiert dort unter last ersatzlos, gesehen am 06.08.2026).
    # dank der sperre unten postet er nie doppelt.
    - cron: "42 9 * * *"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sperre gegen doppellauf
        id: guard
        run: |
          DAY=$(date -u +%Y-%m-%d)
          if [ -f "graphics/archive/$DAY.png" ]; then
            echo "done=1" >> "$GITHUB_OUTPUT"
            echo "heute schon gelaufen, nichts zu tun"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != '1'
        with:
          python-version: "3.12"
      - name: install playwright
        if: steps.guard.outputs.done != '1'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      # setzt picked=1 wenn ein kandidat frei war, sonst picked=0.
      # picked=0 heisst bewusst kein post, kein fehler. der lauf bleibt gruen
      # und die schritte darunter werden uebersprungen.
      - name: pick the number
        id: pick
        if: steps.guard.outputs.done != '1'
        run: |
          python scripts/number_of_day_data.py \
            --out data/number-of-day.json
      - name: render
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        run: |
          python scripts/number_of_day.py \
            --input data/number-of-day.json \
            --output graphics/number-of-day.png
      - name: archive dated copy
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        run: |
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p graphics/archive
          cp graphics/number-of-day.png "graphics/archive/$DAY.png"
      - name: post to discord and telegram
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        env:
          DISCORD_WEBHOOK_NUMBER: ${{ secrets.DISCORD_WEBHOOK_NUMBER }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/post_number_of_day.py \
            --data data/number-of-day.json \
            --image graphics/number-of-day.png
      # laeuft auch an tagen ohne post. sonst geht das gedaechtnis verloren,
      # gegen das die sperrfristen rechnen.
      - name: commit
        if: steps.guard.outputs.done != '1'
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add graphics/ data/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "number of the day $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
      - name: upload for download
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        uses: actions/upload-artifact@v4
        with:
          name: number-of-day
          path: graphics/number-of-day.png
