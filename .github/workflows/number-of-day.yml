name: number of the day
on:
  workflow_dispatch:
    inputs:
      x_test:
        # stufe 3: testlauf fuer scripts/x_post.py. gesetzt = NUR der
        # x-test-job laeuft (post + selbstantwort, beide sofort geloescht),
        # der normale lauf wird uebersprungen. leer = normaler lauf.
        description: "x-testtext (wird gepostet und sofort geloescht; leer = normaler lauf)"
        required: false
        default: ""
        type: string
  schedule:
    # 08:12 UTC = 10:12 DE. bewusst nicht zur vollen stunde.
    - cron: "12 8 * * *"
    # nachzuegler um 09:42 UTC, falls github den ersten start verschluckt
    # (passiert dort unter last ersatzlos, gesehen am 06.08.2026).
    # dank der sperre unten postet er nie doppelt.
    - cron: "42 9 * * *"
permissions:
  contents: write
jobs:
  x-test:
    if: github.event_name == 'workflow_dispatch' && inputs.x_test != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TEMP 05.10.2026: Testmail fuer die Newsletter-Vorlage Ausgabe 14.
      # brevo-send.yml checkt fest main aus, die Vorlage liegt aber nur im
      # fix-Branch. Dieser Job hier checkt den Dispatch-Ref aus, also den
      # Branch. Wird nach dem Lauf im selben Branch zurueckgenommen, damit der
      # PR nur die Newsletter-Aenderungen traegt.
      - name: vorlage ausgabe 14, testmail
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          NEWSLETTER_TEST_TO: ${{ vars.NEWSLETTER_TEST_TO }}
        run: |
          set -e
          python3 scripts/newsletter_issue.py --selbsttest
          python3 scripts/weekly_facts.py --selbsttest
          python3 scripts/brevo_send.py --selftest > /dev/null && echo "brevo selbsttest ok"
          echo "--- die vorlage selbst muss abgewiesen werden ---"
          if python3 scripts/brevo_send.py --mode test --html newsletter/2026-10-12.html \
               --subject "darf nicht rausgehen" --queue /tmp/q-nein.json; then
            echo "::error::die vorlage mit offenen platzhaltern haette abgewiesen werden muessen"
            exit 1
          fi
          echo "--- gefuellte kopie, testmail ---"
          cp newsletter/2026-10-12.html /tmp/2026-10-12.html
          python3 scripts/newsletter_issue.py set /tmp/2026-10-12.html
          python3 - <<'EOP'
          s = open("/tmp/2026-10-12.html", encoding="utf-8").read()
          s = s.replace("{{SUBJECT}}", "TEST vorlage ausgabe 14")
          s = s.replace("VIDEO_URL", "https://youtu.be/yobwNnm3wBM")
          open("/tmp/2026-10-12.html", "w", encoding="utf-8").write(s)
          EOP
          python3 scripts/brevo_send.py --mode test --html /tmp/2026-10-12.html \
            --subject "TEST vorlage ausgabe 14 (kein versand)" --queue /tmp/q.json
          cat /tmp/q.json

      - name: x testpost, sofort geloescht
        if: false   # TEMP: dieser lauf schickt nur die testmail, kein x-post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_TEST: ${{ inputs.x_test }}
        run: |
          python scripts/x_post.py --selftest
          python scripts/x_post.py --text "$X_TEST" --image graphics/number-of-day.png \
            --reply "$X_TEST (reply)" --delete-after --log /tmp/x-test-log.json
          cat /tmp/x-test-log.json

  render:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.x_test != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sperre gegen doppellauf
        id: guard
        run: |
          DAY=$(date -u +%Y-%m-%d)
          if [ -f "graphics/archive/$DAY.png" ]; then
            echo "done=1" >> "$GITHUB_OUTPUT"
            echo "heute schon gelaufen, nichts zu tun"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != '1'
        with:
          python-version: "3.12"
      - name: install playwright
        if: steps.guard.outputs.done != '1'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      # setzt picked=1 wenn ein kandidat frei war, sonst picked=0.
      # picked=0 heisst bewusst kein post, kein fehler. der lauf bleibt gruen
      # und die schritte darunter werden uebersprungen.
      - name: pick the number
        id: pick
        if: steps.guard.outputs.done != '1'
        run: |
          python scripts/number_of_day_data.py \
            --out data/number-of-day.json
      - name: render
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        run: |
          python scripts/number_of_day.py \
            --input data/number-of-day.json \
            --output graphics/number-of-day.png
      - name: archive dated copy
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        run: |
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p graphics/archive
          cp graphics/number-of-day.png "graphics/archive/$DAY.png"
      - name: post to discord and telegram
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        env:
          DISCORD_WEBHOOK_NUMBER: ${{ secrets.DISCORD_WEBHOOK_NUMBER }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/post_number_of_day.py \
            --data data/number-of-day.json \
            --image graphics/number-of-day.png
      # stufe 3: derselbe text auf x, bild dazu, selbstantwort nur mit link.
      # sperre: data/x-post-log.json (key nod-<datum>), nie doppelt.
      # faellt x aus, wird der lauf rot, aber archiv und log werden unten
      # trotzdem committet (always), sonst rechnet die sperrfrist nicht weiter.
      - name: post to x
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python scripts/x_post.py \
            --from-nod data/number-of-day.json \
            --image graphics/number-of-day.png \
            --log data/x-post-log.json
      # laeuft auch an tagen ohne post und auch, wenn discord oder x rot
      # waren. sonst geht das gedaechtnis verloren, gegen das die
      # sperrfristen rechnen, und der x-post-log haette die id nicht.
      - name: commit
        if: always() && steps.guard.outputs.done != '1'
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add graphics/ data/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "number of the day $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
      - name: upload for download
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        uses: actions/upload-artifact@v4
        with:
          name: number-of-day
          path: graphics/number-of-day.png
