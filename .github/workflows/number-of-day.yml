name: number of the day
on:
  workflow_dispatch:
    inputs:
      x_test:
        # stufe 3: testlauf fuer scripts/x_post.py. gesetzt = NUR der
        # x-test-job laeuft (post + selbstantwort, beide sofort geloescht),
        # der normale lauf wird uebersprungen. leer = normaler lauf.
        description: "x-testtext (wird gepostet und sofort geloescht; leer = normaler lauf)"
        required: false
        default: ""
        type: string
  schedule:
    # 08:12 UTC = 10:12 DE. bewusst nicht zur vollen stunde.
    - cron: "12 8 * * *"
    # nachzuegler um 09:42 UTC, falls github den ersten start verschluckt
    # (passiert dort unter last ersatzlos, gesehen am 06.08.2026).
    # dank der sperre unten postet er nie doppelt.
    - cron: "42 9 * * *"
permissions:
  contents: write
jobs:
  x-test:
    if: github.event_name == 'workflow_dispatch' && inputs.x_test != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # TROCKENLAUF MONTAGSROUTINE, 12.09.2026, wird nach dem Lauf wieder
      # entfernt. Grund: neue Workflow-Dateien sind erst dispatchbar, wenn sie
      # auf main liegen; dieser Job liegt auf main und laeuft mit dem Stand des
      # Branches, den man beim Start als ref angibt.
      - name: selbsttests
        run: |
          python scripts/x_post.py --selftest
          python scripts/yt_live_check.py --selftest
          python scripts/brevo_send.py --selftest

      - name: A9.2 laeuft heute ein video
        env:
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
        run: |
          echo "YT_CHANNEL_ID gesetzt: ${YT_CHANNEL_ID:+ja}${YT_CHANNEL_ID:-nein}"
          python scripts/yt_live_check.py --channel-id "$YT_CHANNEL_ID" | tee /tmp/yt.json
          echo "--- gegen montag geprueft ---"
          python scripts/yt_live_check.py --channel-id "$YT_CHANNEL_ID" --date 2026-09-14

      - name: A9.1 brevo testmail
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          NEWSLETTER_TEST_TO: ${{ vars.NEWSLETTER_TEST_TO }}
        run: |
          echo "NEWSLETTER_TEST_TO gesetzt: ${NEWSLETTER_TEST_TO:+ja}${NEWSLETTER_TEST_TO:-nein}"
          python scripts/brevo_send.py --mode test \
            --html newsletter/2026-09-14.html --subject "TEST" \
            --queue /tmp/newsletter-queue.json
          cat /tmp/newsletter-queue.json

      - name: A9.3 montagsfaden, nur gedruckt
        run: |
          python scripts/x_post.py --weekly --dry-run --force-date \
            --queue data/weekly-x-queue.json || echo "abbruch wie erwartet, video_url ist leer"
          python - <<'EOP'
          import json
          q = json.load(open("data/weekly-x-queue.json"))
          q["video_url"] = "https://www.youtube.com/watch?v=TESTTESTTES"
          json.dump(q, open("/tmp/weekly-x-queue.json", "w"), indent=1, ensure_ascii=False)
          EOP
          python scripts/x_post.py --weekly --dry-run --force-date \
            --queue /tmp/weekly-x-queue.json

      - name: A9.3 ein testpost mit der wochengrafik, sofort geloescht
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_TEST: ${{ inputs.x_test }}
        run: |
          IMAGE=$(python -c "import json;print(json.load(open('data/weekly-x-queue.json'))['image'])")
          echo "wochengrafik: $IMAGE"
          python scripts/x_post.py --text "$X_TEST" --image "$IMAGE" \
            --delete-after --log /tmp/x-test-log.json
          cat /tmp/x-test-log.json

  render:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.x_test != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sperre gegen doppellauf
        id: guard
        run: |
          DAY=$(date -u +%Y-%m-%d)
          if [ -f "graphics/archive/$DAY.png" ]; then
            echo "done=1" >> "$GITHUB_OUTPUT"
            echo "heute schon gelaufen, nichts zu tun"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.done != '1'
        with:
          python-version: "3.12"
      - name: install playwright
        if: steps.guard.outputs.done != '1'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      # setzt picked=1 wenn ein kandidat frei war, sonst picked=0.
      # picked=0 heisst bewusst kein post, kein fehler. der lauf bleibt gruen
      # und die schritte darunter werden uebersprungen.
      - name: pick the number
        id: pick
        if: steps.guard.outputs.done != '1'
        run: |
          python scripts/number_of_day_data.py \
            --out data/number-of-day.json
      - name: render
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        run: |
          python scripts/number_of_day.py \
            --input data/number-of-day.json \
            --output graphics/number-of-day.png
      - name: archive dated copy
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        run: |
          DAY=$(date -u +%Y-%m-%d)
          mkdir -p graphics/archive
          cp graphics/number-of-day.png "graphics/archive/$DAY.png"
      - name: post to discord and telegram
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        env:
          DISCORD_WEBHOOK_NUMBER: ${{ secrets.DISCORD_WEBHOOK_NUMBER }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/post_number_of_day.py \
            --data data/number-of-day.json \
            --image graphics/number-of-day.png
      # stufe 3: derselbe text auf x, bild dazu, selbstantwort nur mit link.
      # sperre: data/x-post-log.json (key nod-<datum>), nie doppelt.
      # faellt x aus, wird der lauf rot, aber archiv und log werden unten
      # trotzdem committet (always), sonst rechnet die sperrfrist nicht weiter.
      - name: post to x
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python scripts/x_post.py \
            --from-nod data/number-of-day.json \
            --image graphics/number-of-day.png \
            --log data/x-post-log.json
      # laeuft auch an tagen ohne post und auch, wenn discord oder x rot
      # waren. sonst geht das gedaechtnis verloren, gegen das die
      # sperrfristen rechnen, und der x-post-log haette die id nicht.
      - name: commit
        if: always() && steps.guard.outputs.done != '1'
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add graphics/ data/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "number of the day $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
      - name: upload for download
        if: steps.guard.outputs.done != '1' && steps.pick.outputs.picked == '1'
        uses: actions/upload-artifact@v4
        with:
          name: number-of-day
          path: graphics/number-of-day.png
