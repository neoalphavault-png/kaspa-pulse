# Kaspa Pulse · Secrets nach c2 übertragen
# Ablageort im Repo: .github/workflows/server-secrets.yml
#
# WAS DIESER LAUF TUT. Er legt drei Werte auf c2 ab, an diesen Rechner
# gebunden verschlüsselt: discord_webhook, telegram_bot_token,
# telegram_chat_id. Danach liest der Entity-X-Alarm sie über
# LoadCredentialEncrypted aus /etc/credstore.encrypted/.
#
# WAS ER NICHT TUT. Er fasst gh_dispatch_token nicht an. Das Token für
# den Taktgeber wird einmal auf dem Server eingetippt
# (systemd-ask-password), es kommt nie durch eine Leitung und steht in
# keinem Secret. Der Server weist es sogar ab, falls es hier doch
# jemand versucht (kp-credstore-put).
#
# WARUM DAS SICHER IST. Der Schlüssel in SERVER_SSH_KEY kann auf c2
# keine Shell bekommen. In der authorized_keys von kpdeploy steht ein
# erzwungener Befehl (kp-credstore-ssh) mit "restrict": kein Terminal,
# kein Port- und kein Agent-Forwarding. Dieser Schlüssel kann genau
# "put <einer von drei Namen>" und "liste". Mehr nicht.
#
# KEIN WERT STEHT IN EINEM LOG. Die Werte gehen über stdin durch die
# SSH-Verbindung, nie über eine Kommandozeile, nie durch echo. Der
# Server bestätigt nur Name und Größe der verschlüsselten Datei.
name: server-secrets

on:
  workflow_dispatch:
    inputs:
      ziel:
        description: "Discord-Ziel. moderator = #moderator-only (48 h Parallelbetrieb), normal = der öffentliche Kanal"
        type: choice
        options: [moderator, normal]
        default: moderator
      was:
        description: "Welche Werte übertragen"
        type: choice
        options: [alle, nur-discord, nur-telegram]
        default: alle

permissions: {}

concurrency:
  group: server-secrets
  cancel-in-progress: false

jobs:
  uebertragen:
    # Nur der Inhaber. Ein Fork oder ein fremder Mitarbeiter kommt hier
    # nicht an die Secrets.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: zugang vorbereiten
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -eu
          for n in SERVER_SSH_KEY SERVER_HOST_KEY SERVER_HOST; do
            eval "w=\${$n}"
            [ -n "$w" ] || { echo "::error::Secret $n ist leer oder fehlt"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SERVER_HOST_KEY" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          # Der Fingerabdruck des Servers, zum Vergleich mit dem, was
          # setup.sh hostkey auf c2 zeigt. Kein Wert, nur ein Hash.
          ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" | awk '{print $1, $2, $NF}'
          # Gegenprobe der Verbindung. "liste" zeigt Namen und Größen,
          # keine Werte.
          ssh -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "kpdeploy@$SERVER_HOST" liste

      - name: discord_webhook
        if: inputs.was != 'nur-telegram'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          W_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
          W_NORMAL: ${{ secrets.DISCORD_WEBHOOK }}
          ZIEL: ${{ inputs.ziel }}
        run: |
          set -eu
          # DISCORD_WEBHOOK_OPS schreibt nach #moderator-only (Ben,
          # 09.10.2026), genau dorthin sollen die 48 h Parallelbetrieb.
          if [ "$ZIEL" = "moderator" ]; then
            W="$W_OPS"; NAME=DISCORD_WEBHOOK_OPS
          else
            W="$W_NORMAL"; NAME=DISCORD_WEBHOOK
            echo "::warning::ziel=normal, der Alarm von c2 postet ab jetzt öffentlich"
          fi
          [ -n "$W" ] || { echo "::error::Secret $NAME ist leer"; exit 1; }
          echo "Quelle: $NAME (Name, nicht Wert)"
          printf '%s' "$W" | ssh -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "kpdeploy@$SERVER_HOST" put discord_webhook

      - name: telegram
        if: inputs.was != 'nur-discord'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          T_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          T_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eu
          [ -n "$T_TOKEN" ] || { echo "::error::TELEGRAM_BOT_TOKEN ist leer"; exit 1; }
          [ -n "$T_CHAT" ]  || { echo "::error::TELEGRAM_CHAT_ID ist leer"; exit 1; }
          printf '%s' "$T_TOKEN" | ssh -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "kpdeploy@$SERVER_HOST" put telegram_bot_token
          printf '%s' "$T_CHAT" | ssh -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "kpdeploy@$SERVER_HOST" put telegram_chat_id

      - name: gegenprobe
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -eu
          echo "Credentials auf c2, Namen und Größen:"
          ssh -i "$RUNNER_TEMP/ssh/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "kpdeploy@$SERVER_HOST" liste
          echo
          echo "gh_dispatch_token gehört NICHT in diese Liste, solange es"
          echo "nicht von Hand auf dem Server eingegeben wurde."

      - name: aufraeumen
        if: always()
        run: |
          set -eu
          if [ -d "$RUNNER_TEMP/ssh" ]; then
            find "$RUNNER_TEMP/ssh" -type f -exec shred -u {} +
            rmdir "$RUNNER_TEMP/ssh"
          fi
          echo "Schlüssel vom Runner entfernt"
