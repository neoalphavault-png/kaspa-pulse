name: secret scan

# Regel (Ben, 02.10.2026): Keine Schluessel, Tokens oder Secrets im Chat und
# nie in einer Datei im Repo, nur in GitHub Secrets, gelesen aus der Umgebung.
#
# Anlass: Am 30.09.2026 standen OAuth-Werte in scripts/x_post.py, und GitHubs
# Secret-Scanning meldete 0 Alerts. Deshalb laeuft hier bei jedem Push und jedem
# PR unser eigener Check mit unseren Mustern (scripts/secret_scan.py). Er wird
# rot, sobald ein neuer Commit oder eine Datei im Stand einen Treffer hat, und
# druckt nie einen Wert, nur Datei, Zeile, Art und Fingerabdruck.
#
# Was "blockiert" hier heisst: Ein Push auf GitHub laesst sich aus einer Action
# heraus nicht zurueckweisen. Der Lauf wird rot, automerge-claude.yml fuehrt
# denselben Check vor dem Merge aus und merged dann nicht. Lokal halten die
# Hooks in .githooks/ den Commit und den Push an
# (git config core.hooksPath .githooks).
#
# Pushes, die Actions selbst mit GITHUB_TOKEN machen (die Bot-Commits auf main),
# loesen diesen Workflow nicht aus. Das ist GitHubs Schleifenschutz.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: selbsttest
        run: python3 scripts/secret_scan.py --selbsttest
      - name: neue commits
        env:
          EREIGNIS: ${{ github.event_name }}
          VORHER: ${{ github.event.before }}
          NACHHER: ${{ github.sha }}
          PR_BASIS: ${{ github.event.pull_request.base.sha }}
          PR_SPITZE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          git fetch -q origin main
          if [ "$EREIGNIS" = "pull_request" ]; then
            python3 scripts/secret_scan.py --bereich "$PR_BASIS..$PR_SPITZE"
          elif [ "$EREIGNIS" = "push" ] && [ -n "$VORHER" ] \
               && [ "$VORHER" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$VORHER^{commit}" 2>/dev/null; then
            python3 scripts/secret_scan.py --bereich "$VORHER..$NACHHER"
          else
            python3 scripts/secret_scan.py --neu-gegen origin/main
          fi
      - name: alle dateien im stand
        if: always()
        run: python3 scripts/secret_scan.py --baum
