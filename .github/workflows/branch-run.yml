name: branch run

# ZEITWEILIG, NUR IN DIESEM BRANCH, NUR LESEND.
#
# GitHub laesst workflow_dispatch nur fuer Workflow-Dateien zu, die auf dem
# Default-Branch liegen. Die neuen Dateien dieses Branches (covenants-log.yml,
# quellen-probe.yml) liegen dort noch nicht und sind deshalb von Hand nicht
# ausloesbar, bis Ben sie merged. Ein push-Trigger laeuft dagegen aus dem
# Branch heraus, in dem er steht.
#
# Diese Datei ist das Vehikel fuer den Machbarkeits- und den Selbsttestlauf.
# Sie haengt an genau einem Branchnamen, kann auf main also nichts ausloesen,
# sie hat ausdruecklich NUR Leserechte und schreibt nichts ins Repo zurueck.
# Ergebnisse gehen als Artefakt raus und werden von Hand committet. Die Datei
# wird vor dem Abschluss des Branches wieder geloescht.

on:
  push:
    branches:
      - data/covenants-distribution-2026-09-22
    paths:
      - ".github/branch-run.txt"

permissions:
  contents: read

jobs:
  lauf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: was ansteht
        id: was
        run: |
          echo "schritt=$(head -n 1 .github/branch-run.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          cat .github/branch-run.txt

      - name: quellen sondieren
        if: steps.was.outputs.schritt == 'quellen'
        run: python3 scripts/quellen_probe.py

      - name: quellen sondieren, zweite runde
        if: steps.was.outputs.schritt == 'quellen2'
        run: python3 scripts/quellen_probe2.py

      - name: quellen sondieren, dritte runde
        if: steps.was.outputs.schritt == 'quellen3'
        run: python3 scripts/quellen_probe3.py

      - name: selbsttests
        if: steps.was.outputs.schritt == 'messreihe'
        run: |
          python3 scripts/covenants_log.py --selftest
          python3 scripts/covenants_page.py --selftest

      - name: covenants holen
        if: steps.was.outputs.schritt == 'messreihe'
        run: python3 scripts/covenants_log.py

      - name: seite gegen das log rendern
        if: steps.was.outputs.schritt == 'messreihe'
        run: python3 scripts/covenants_page.py

      - name: angezeigte zahlen gegen das log pruefen
        if: steps.was.outputs.schritt == 'messreihe'
        run: python3 scripts/covenants_page.py --check

      - name: kontrollwerte gegen die handzahlen vom 19.09.
        if: steps.was.outputs.schritt == 'messreihe'
        run: |
          python3 - <<'PY'
          import json
          log = json.load(open("data/covenants-log.json"))
          nach = {e["datum"]: e for e in log["tage"]}
          hand = {"utxo_count": 10780, "tx": 542}
          tag = "2026-09-19"
          e = nach.get(tag)
          print("handablesung Ben, %s: utxo_count %s, transactions %s"
                % (tag, hand["utxo_count"], hand["tx"]))
          if e is None:
              print("  der tag steht nicht im log")
          else:
              for k, soll in hand.items():
                  ist = e.get(k)
                  d = "" if ist is None else " (abweichung %+d)" % (ist - soll)
                  print("  %-11s runner %-10s hand %-10s%s" % (k, ist, soll, d))
          print("\nnachbartage, falls die ablesung einen tag daneben lag:")
          for t in ("2026-09-17", "2026-09-18", "2026-09-19", "2026-09-20", "2026-09-21"):
              x = nach.get(t, {})
              print("  %s  tx %-8s outputs %-8s utxo %s"
                    % (t, x.get("tx"), x.get("outputs"), x.get("utxo_count")))
          print("\nspanne im log: %s bis %s, %d tage"
                % (log["tage"][0]["datum"], log["tage"][-1]["datum"], len(log["tage"])))
          PY

      # Die holders-Zahl in data/week-input.json ist seit dem 21.09. ohne
      # geklaerte Quelle. scripts/kaspalytics.py holt laengst ein Feld
      # holder_addr aus /api/charts/address/count/meaningful-balance. Dieser
      # Schritt druckt es, damit der Bericht die Vermutung mit einer Zahl
      # belegen kann statt mit einem Gefuehl.
      - name: holder_addr zur einordnung drucken
        if: steps.was.outputs.schritt == 'messreihe'
        run: python3 scripts/kaspalytics.py || true

      # Der Arbeitscontainer kommt an den Artefaktspeicher nicht heran
      # (derselbe Proxy, der auch kaspalytics blockt). Damit die Logdatei
      # trotzdem von Hand ins Repo wandern kann, steht sie zusaetzlich im
      # Joblog, zwischen zwei Markierungen.
      - name: logdatei ins joblog
        if: steps.was.outputs.schritt == 'messreihe'
        run: |
          python3 - <<'PY'
          import json
          log = json.load(open("data/covenants-log.json"))
          print("META", log["quelle"], log["aktualisiert_utc"], log["toccata_aktiv_seit"])
          print("CSV datum,tx,outputs_created,outputs_spent,utxo_count")
          for e in log["tage"]:
              print("CSV %s,%s,%s,%s,%s" % (
                  e["datum"],
                  "" if e.get("tx") is None else e["tx"],
                  "" if e.get("outputs_created") is None else e["outputs_created"],
                  "" if e.get("outputs_spent") is None else e["outputs_spent"],
                  "" if e.get("utxo_count") is None else e["utxo_count"]))
          print("ENDE %d tage" % len(log["tage"]))
          PY

      # Eine Gegenprobe fuer den Fall, dass die Logdatei von Hand aus dem
      # Joblog ins Repo gewandert ist: der Lauf liest die Quelle noch einmal
      # und verschmilzt sie mit der committeten Datei. Meldet er null neue
      # und null nachgezogene Tage, ist die committete Datei Wert fuer Wert
      # dieselbe, die dieses Skript aus der Livequelle erzeugt.
      - name: committete datei gegen die quelle stellen
        if: steps.was.outputs.schritt == 'gegenprobe'
        run: |
          python3 scripts/covenants_log.py --selftest
          python3 scripts/covenants_page.py --selftest
          cp data/covenants-log.json /tmp/committet.json
          python3 scripts/covenants_log.py
          python3 - <<'PY'
          import json
          a = json.load(open("/tmp/committet.json"))
          b = json.load(open("data/covenants-log.json"))
          fa = {e["datum"]: {k: e.get(k) for k in
                             ("tx", "outputs", "outputs_created", "outputs_spent", "utxo_count")}
                for e in a["tage"]}
          fb = {e["datum"]: {k: e.get(k) for k in
                             ("tx", "outputs", "outputs_created", "outputs_spent", "utxo_count")}
                for e in b["tage"]}
          nur_a = sorted(set(fa) - set(fb))
          nur_b = sorted(set(fb) - set(fa))
          anders = sorted(d for d in set(fa) & set(fb) if fa[d] != fb[d])
          print("committet %d tage, frisch geholt %d tage" % (len(fa), len(fb)))
          print("nur in der committeten datei: %s" % (nur_a or "keine"))
          print("nur frisch geholt:            %s" % (nur_b or "keine"))
          print("werte verschieden:            %s" % (anders or "keine"))
          for d in anders[:10]:
              print("   %s  committet %s  frisch %s" % (d, fa[d], fb[d]))
          raise SystemExit(1 if (nur_a or anders) else 0)
          PY
          python3 scripts/covenants_page.py --check

      - name: ergebnis zum herunterladen
        if: steps.was.outputs.schritt == 'messreihe'
        uses: actions/upload-artifact@v4
        with:
          name: messreihe
          path: |
            data/covenants-log.json
            kaspa-covenants.html
