# Kaspa Pulse · Entity X Watcher
# Ablageort im Repo: .github/workflows/entity-x-alert.yml
#
# Der Job startet alle 10 Minuten und pollt dann intern jede Minute, bis
# neun Minuten um sind. Dadurch liegt die Erkennungszeit bei rund einer Minute
# statt bei bis zu 30 Minuten. Braucht ein Repository-Secret DISCORD_WEBHOOK.
name: entity-x-alert

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten, der Job selbst laeuft 9 Minuten durch
  workflow_dispatch: {}       # manueller Testlauf ueber den Actions-Tab

permissions:
  contents: write             # darf die State-Datei zurueck ins Repo schreiben

concurrency:
  group: entity-x-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: watch entity x
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: "540"
        run: python3 scripts/entity_x_alert.py

      - name: persist state if changed
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add scripts/entity_x_state.json
          if git diff --staged --quiet; then
            echo "state unveraendert, kein commit"
          else
            git commit -m "entity x state update [bot]"
            git pull --rebase origin main
            git push
          fi
