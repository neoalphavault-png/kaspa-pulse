# Kaspa Pulse · Entity X Watcher
# Ablageort im Repo: .github/workflows/entity-x-alert.yml
#
# Gemessen am 11.08.2026: GitHub startet den Zeitplan */10 in der Praxis nur
# etwa stuendlich, nicht alle zehn Minuten. Der Job bleibt deshalb 50 Minuten
# am Leben und prueft intern jede Minute, damit die Luecke bis zum naechsten
# Start fast geschlossen ist. Die concurrency group verhindert Doppellaeufe.
name: entity-x-alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: entity-x-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: watch entity x
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: "3000"
          POLL_INTERVAL: "60"
        run: python3 scripts/entity_x_alert.py

      - name: persist state if changed
        if: always()
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add scripts/entity_x_state.json
          if git diff --staged --quiet; then
            echo "state unveraendert, kein commit"
          else
            git commit -m "entity x state update [bot]"
            git pull --rebase origin main
            git push
          fi
