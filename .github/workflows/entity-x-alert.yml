# Kaspa Pulse · Entity X Watcher
# Ablageort im Repo: .github/workflows/entity-x-alert.yml
#
# UMSTELLUNG 07.10.2026 auf Dauerbeobachtung.
#
# Was vorher war, gemessen ueber sieben Tage (30.09. bis 06.10.):
# der Zeitplan stand auf "*/10", also nominell 144 Starts am Tag. GitHub
# hat davon rund fuenf ausgefuehrt. Jeder Lauf beobachtete 50 Minuten, das
# ergab 17,3 Prozent Abdeckung, 35 Luecken, im Schnitt 4,1 Stunden, die
# laengste 8,1 Stunden. Die Bewegung vom 07.10. (3.143.758 KAS um
# 08:17:12 UTC) fiel in so eine Luecke, 61 Minuten nach Fensterende.
#
# Was jetzt gilt:
#   1. SELBSTNEUSTART ist der Antrieb. Am Ende jedes Laufs stoesst der Job
#      per workflow_dispatch den naechsten an. Dass das mit dem
#      GITHUB_TOKEN geht, ist am 07.10. mit einer Sonde geprueft worden
#      (drei Generationen aus einem einzigen Dispatch). Es braucht dafuer
#      "actions: write", sonst antwortet die API mit 403.
#   2. INNENSCHLEIFE knapp unter dem Sechs-Stunden-Limit von GitHub.
#      LOOP_SECONDS 20400 sind 5 h 40 min. Die Pruefung laeuft jede Minute.
#   3. ZEITPLAN NUR ALS RUECKFALL, alle sechs Stunden. Er greift, wenn die
#      Kette reisst, etwa nach einem Abbruch oder einer Stoerung der API.
#   4. CONCURRENCY-GRUPPE gegen Doppellaeufe. Treffen Selbstneustart und
#      Zeitplan zusammen, laeuft einer, der andere wartet und startet
#      direkt danach. Das schliesst die Luecke zusaetzlich.
#
# Gegen DOPPELTE ALARME wirken zwei Dinge. Die Gruppe verhindert, dass
# zwei Laeufe gleichzeitig denselben Zufluss sehen. Und der Bot schreibt
# den Vergleichsstand ab jetzt SOFORT nach jedem Alarm fest (PERSIST_EACH),
# nicht erst am Jobende. Sonst waere bei einem Abbruch der Stand von bis zu
# 5 h 40 min Bewegung verloren und der naechste Lauf meldete dieselbe
# Bewegung noch einmal.
#
# NOTBREMSE: Workflow in der Actions-Oberflaeche deaktivieren. Das sperrt
# auch workflow_dispatch, die Kette reisst damit sofort ab. Ein
# "git revert" allein genuegt nicht, solange noch ein Lauf unterwegs ist.
#
# Die Abdeckung je Tag steht am Ende jedes Laufs im Log und wird in
# data/entity-x-watch-log.json mitgeschrieben, damit sie messbar ist und
# nicht geschaetzt werden muss.

name: entity-x-alert

on:
  schedule:
    # Rueckfall, nicht der Antrieb. Bewusst nicht zur vollen Stunde.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "self = aus dem Selbstneustart, manual = von Hand"
        required: false
        default: "manual"

permissions:
  contents: write
  actions: write        # genau das braucht der Selbstneustart

concurrency:
  group: entity-x-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # GitHub bricht einen Job nach 6 h hart ab. 355 Minuten lassen Luft,
    # und die Innenschleife darunter hat ihr eigenes, kuerzeres Limit.
    timeout-minutes: 355
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: watch entity x
        # Eigenes Limit auf dem Schritt, nicht nur auf dem Job. Laeuft der
        # Schritt in sein Limit, geht der Job weiter und die beiden
        # folgenden Schritte kommen noch dran. Ein Job-Limit wuerde sie
        # ueberspringen, und dann waere der Vergleichsstand nicht
        # festgeschrieben und kein Nachfolger angestossen.
        timeout-minutes: 345
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_SECONDS: "20400"      # 5 h 40 min
          POLL_INTERVAL: "60"
          PERSIST_EACH: "1"          # nach jedem Alarm sofort festschreiben
          ALERT_CHAIN: ${{ inputs.chain || 'schedule' }}
        run: python3 scripts/entity_x_alert.py

      - name: persist state if changed
        if: always()
        run: |
          git config user.name "kaspa-pulse-bot"
          git config user.email "bot@kaspapulse.com"
          git add scripts/entity_x_state.json data/entity-x-watch-log.json
          if git diff --staged --quiet; then
            echo "state unveraendert, kein commit"
          else
            git commit -m "entity x state update [bot]"
            git pull --rebase origin main
            git push
          fi

      - name: naechsten lauf anstossen
        # Auch nach einem Fehlschlag. Sonst reisst eine einzelne Stoerung
        # die Kette, und es waere bis zum naechsten Zeitplan-Start still.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CODE=$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/entity-x-alert.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":"self"}}')
          echo "dispatch http ${CODE}"
          cat /tmp/dispatch.txt || true
          if [ "$CODE" != "204" ]; then
            echo "::warning::Selbstneustart abgelehnt (http ${CODE}). Der" \
                 "Zeitplan alle sechs Stunden faengt den Lauf auf."
          fi
