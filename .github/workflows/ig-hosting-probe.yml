# Einmalige Sonde (08.10.2026), nur lesend, nur auf diesem pruefung-Branch.
# Frage 2: findet instagram.py artefakt() die Grafik im Artefakt eines
# Tagesgrafik-Laufs (hier Handlauf 37781564802, Format nach #58)? Kein Token
# fuer Instagram, keine Veroeffentlichung, nur GitHub-API mit actions: read.
name: ig hosting probe
on:
  push:
    branches:
      - pruefung/ig-hosting-2026-10-08
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: artefakt finden wie um 09:30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io, json, sys, zipfile
          sys.path.insert(0, "scripts")
          import instagram as ig
          arts = ig.gh("actions/runs/37781564802/artifacts")["artifacts"]
          z = zipfile.ZipFile(io.BytesIO(ig.gh("actions/artifacts/%d/zip" % arts[0]["id"], roh=True)))
          print("im artefakt:", sorted(z.namelist()))
          name = next(n for n in z.namelist() if n.endswith("-instagram.json"))
          d = json.loads(z.read(name))
          print("caption-datei:", {k: d[k] for k in ("datum", "form", "messzeit_utc", "zahl", "tag", "herkunft")})
          png, cap = ig.artefakt({"form": d["form"], "messzeit_utc": d["messzeit_utc"]}, "out/ig")
          print("gefunden:", png, png.stat().st_size, "bytes,", cap)
          j = ig.jpeg(png, "out/jpg")
          print("jpeg:", j, j.stat().st_size, "bytes")
          try:
              ig.artefakt({"form": 2, "messzeit_utc": "2026-10-08T06:44:02+00:00"}, "out/ig2")
          except ig.Fehler as exc:
              print("morgenlauf vor #58, erwartet nicht gefunden:", exc)
          PY
