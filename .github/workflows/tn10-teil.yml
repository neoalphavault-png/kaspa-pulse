# Kaspa Pulse - ein Teil-Lauf des tn10-zaehlers (Ben, 07.10.2026)
#
# Wird nur von tn10-zaehler.yml aufgerufen, hat keinen eigenen Trigger.
# Nur lesend: zwei Knoten-Verbindungen und Stichproben beim TN10-Indexer.
# Keine Wallet, keine Schluessel, keine Secrets, nichts ins Repo.

name: tn10 teil

on:
  workflow_call:
    inputs:
      teil:
        type: string
        required: true
      bis:
        type: string
        required: true
      von:
        type: string
        required: true
      bis_plan:
        type: string
        required: true

permissions:
  contents: read

jobs:
  zaehlen:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sdk, version und pruefsumme fest
        run: "pip install --only-binary=:all: --require-hashes -r scripts/maschinenzahlungen-requirements.txt"
      - name: selbsttest
        run: python3 scripts/tn10_zaehler.py --selbsttest
      - name: zaehlen
        env:
          TEIL: ${{ inputs.teil }}
          BIS: ${{ inputs.bis }}
          VON: ${{ inputs.von }}
          BIS_PLAN: ${{ inputs.bis_plan }}
        # k1 und k2 in zwei prozessen (TN10-Checkout 08.10.2026: ein prozess schaffte
        # die vollen bloecke beider knoten unter rund 2.500 tx/s nicht). die
        # partnerdatei mit host und kennung von k1 liegt unter RUNNER_TEMP, nie im artefakt.
        run: |
          mkdir -p out/einzeln
          P="$RUNNER_TEMP/tn10-k1-partner.json"
          ARGS=(--teil "$TEIL" --bis "$BIS" --von "$VON" --bis-plan "$BIS_PLAN" --partner "$P")
          python3 scripts/tn10_zaehler.py "${ARGS[@]}" --rolle k1 --out "out/einzeln/tn10-$TEIL-k1" > out/einzeln/k1.log 2>&1 &
          P1=$!
          python3 scripts/tn10_zaehler.py "${ARGS[@]}" --rolle k2 --out "out/einzeln/tn10-$TEIL-k2" > out/einzeln/k2.log 2>&1 &
          P2=$!
          S=0
          wait $P1 || S=1
          wait $P2 || S=1
          echo "=== k1, ende des logs"; tail -n 25 out/einzeln/k1.log
          echo "=== k2, ende des logs"; tail -n 25 out/einzeln/k2.log
          python3 scripts/tn10_zaehler.py --kombinieren "out/einzeln/tn10-$TEIL-k1" "out/einzeln/tn10-$TEIL-k2" \
            --teil "$TEIL" --von "$VON" --bis-plan "$BIS_PLAN" --out "out/tn10-$TEIL"
          exit $S
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tn10-teil-${{ inputs.teil }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30
