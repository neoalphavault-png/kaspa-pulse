# Kaspa Pulse - Abschnitt eines Berichts in den privaten Ops-Kanal (Ben, 26.10.2026)
#
# Laeuft nur bei einem Push auf einen Branch bericht/... mit einer Aenderung
# unter berichte/. Gesendet wird nur der Abschnitt zwischen <!-- discord -->
# und <!-- /discord -->, mit einer Kopfzeile "📤 VON HAND". scripts/bericht_discord.py
# prueft vorher auf IP, Kaspa-Adresse, Hostname und Schluessel; bei einem Fund
# geht nichts raus. Das Secret steht nur in der Umgebung des Sendeschritts und
# wird nie ausgegeben.
#
# Gegen doppelten Versand (Ben, 26.10.2026, der STP-Rat kam zweimal):
#   - nur Berichte aus den Commits dieses Pushes, die zum ersten Mal ins Repo
#     kamen (distinct). Berichte eines Eltern-Branches zaehlen nicht.
#   - je Bericht die Pruefsumme des Abschnitts in gesendet.json auf dem Branch
#     ops/bericht-gesendet. Derselbe Abschnitt geht nie zweimal raus, auch
#     nicht nach Rebase, Force-Push oder auf einem anderen Branch.
# Die Merkdatei traegt nur Branch, Pfad, Pruefsumme und Zeit. Alle Laeufe
# stehen in einer Warteschlange, damit zwei Laeufe nicht gleichzeitig schreiben.

name: bericht discord

on:
  push:
    branches:
      - "bericht/**"
    paths:
      - "berichte/**"

permissions:
  contents: write

concurrency:
  group: bericht-discord
  cancel-in-progress: false

env:
  MERK_BRANCH: ops/bericht-gesendet

jobs:
  senden:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: selbsttest
        run: python3 scripts/bericht_discord.py --selbsttest | tail -n 1

      - name: merkdatei holen
        run: |
          set -euo pipefail
          if git fetch -q origin "$MERK_BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:gesendet.json > "$RUNNER_TEMP/gesendet.json"
            echo "merkdatei: $(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["eintraege"]))' "$RUNNER_TEMP/gesendet.json") eintraege"
          else
            echo '{"eintraege": []}' > "$RUNNER_TEMP/gesendet.json"
            echo "merkdatei neu"
          fi
          cp "$RUNNER_TEMP/gesendet.json" "$RUNNER_TEMP/gesendet-vorher.json"

      - name: berichte dieses pushes senden
        env:
          DISCORD_WEBHOOK_OPS: ${{ secrets.DISCORD_WEBHOOK_OPS }}
        run: |
          python3 scripts/bericht_discord.py --ereignis "$GITHUB_EVENT_PATH" --branch "$GITHUB_REF_NAME" \
            --merkdatei "$RUNNER_TEMP/gesendet.json" \
            --link-basis "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"

      - name: merkdatei sichern
        if: always()
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/gesendet.json"
          if cmp -s "$M" "$RUNNER_TEMP/gesendet-vorher.json"; then
            echo "nichts neu gesendet, merkdatei unveraendert"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898309+github-actions[bot]@users.noreply.github.com"
          for versuch in 1 2 3; do
            eltern=""
            if git fetch -q origin "$MERK_BRANCH" 2>/dev/null; then
              git show FETCH_HEAD:gesendet.json > "$RUNNER_TEMP/gesendet-fern.json"
              python3 scripts/bericht_discord.py --vereinen "$M" "$RUNNER_TEMP/gesendet-fern.json"
              eltern="-p FETCH_HEAD"
            fi
            blob=$(git hash-object -w "$M")
            baum=$(printf '100644 blob %s\tgesendet.json\n' "$blob" | git mktree)
            commit=$(git commit-tree "$baum" $eltern -m "bericht discord: gesendet von ${GITHUB_REF_NAME}")
            if git push -q origin "$commit:refs/heads/$MERK_BRANCH"; then
              echo "merkdatei gesichert"
              exit 0
            fi
            sleep $((versuch * 3))
          done
          echo "merkdatei nicht gesichert"
          exit 1
